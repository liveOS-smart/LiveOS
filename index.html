<style>
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    .modal-backdrop { backdrop-filter: blur(3px); }
    input, select, textarea, button { font: inherit; }
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    body { padding-bottom: 0; }

    nav button { -webkit-tap-highlight-color: transparent; }
    /* Short, lightweight motion for page changes and touch feedback. */
    /* Animate the complete page as well as its individual sections. */
    main#ua-page-content.ua-page-enter {
      animation: ua-page-container-in 460ms cubic-bezier(.18,.72,.25,1) both;
      will-change: opacity, transform;
    }
    .ua-page-enter > .space-y-6 > * {
      animation: ua-page-item-in 420ms cubic-bezier(.18,.72,.25,1) both;
      will-change: opacity, transform;
    }
    .ua-page-enter > .space-y-6 > *:nth-child(1) { animation-delay: 0ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(2) { animation-delay: 35ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(3) { animation-delay: 65ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(4) { animation-delay: 95ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(5) { animation-delay: 125ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(n+6) { animation-delay: 145ms; }
    .ua-hero-fuse {
      overflow: visible;
      opacity: .9;
    }
    .ua-hero-fuse-thread {
      fill: none;
      stroke: url(#ua-hero-fuse-gradient);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: none;
    }
    .ua-hero-aircraft {
      opacity: 0;
      filter: drop-shadow(0 0 3px rgba(147,197,253,.95)) drop-shadow(0 0 8px rgba(96,165,250,.75));
      pointer-events: none;
    }
    .ua-page-enter .ua-hero-aircraft {
      opacity: 1;
      animation: ua-hero-aircraft-arrive 3.05s ease-out both;
    }
    .ua-hero-aircraft path {
      fill: #f8fafc;
      stroke: #bfdbfe;
      stroke-width: 1.1;
      stroke-linejoin: round;
    }
    @keyframes ua-hero-aircraft-arrive {
      0%, 5% { opacity: 0; }
      14%, 82% { opacity: 1; }
      100% { opacity: .94; }
    }
    @keyframes ua-hero-fuse-burn {
      0%, 4% { stroke-dashoffset: 1; opacity: 0; }
      12% { opacity: .92; }
      76% { stroke-dashoffset: .12; opacity: .68; }
      91% { stroke-dashoffset: 0; opacity: .26; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes ua-page-container-in {
      from { opacity: .35; transform: translate3d(0, 16px, 0) scale(.995); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes ua-page-item-in {
      from { opacity: .25; transform: translate3d(0, 14px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes ua-modal-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ua-modal-panel-in {
      from { opacity: 0; transform: translate3d(0, 10px, 0) scale(.985); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    .ua-modal-enter { animation: ua-modal-backdrop-in 190ms ease-out both; }
    .ua-modal-enter > div { animation: ua-modal-panel-in 240ms cubic-bezier(.2,.75,.25,1) both; }
    .modal-backdrop { animation: ua-modal-backdrop-in 190ms ease-out both; }
    .modal-backdrop > div { animation: ua-modal-panel-in 240ms cubic-bezier(.2,.75,.25,1) both; }
    nav button {
      transition: color 200ms ease, background-color 220ms ease, box-shadow 220ms ease, transform 220ms cubic-bezier(.2,.75,.25,1);
    }
    nav button:active { transform: scale(.96); }
    nav button span:first-child {
      transition: transform 220ms cubic-bezier(.2,.75,.25,1), background-color 220ms ease, color 220ms ease;
    }
    nav button:active span:first-child { transform: scale(.92); }
    button[data-action] {
      transition-property: color, background-color, border-color, box-shadow, transform, opacity;
      transition-duration: 190ms;
      transition-timing-function: cubic-bezier(.2,.75,.25,1);
      -webkit-tap-highlight-color: transparent;
    }
    button[data-action]:active:not(:disabled) { transform: scale(.975); }
    main#ua-page-content section { transition: box-shadow 220ms ease, border-color 220ms ease; }
    @media (hover: hover) and (pointer: fine) {
      main#ua-page-content section:hover { box-shadow: 0 10px 28px rgba(15, 23, 42, 0.055); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ua-page-enter > .space-y-6 > *, .ua-modal-enter, .ua-modal-enter > div,
      .modal-backdrop, .modal-backdrop > div { animation: none !important; }
      .ua-hero-fuse-thread { animation: none !important; stroke-dashoffset: 0; opacity: .32; }
      nav button, nav button span:first-child, button[data-action],
      main#ua-page-content section { transition: none !important; }
      .ua-nav-indicator-moving, .ua-nav-icon-pop, .ua-nav-label-pop, .ua-nav-indicator-moving::after { animation: none !important; }
    }
    .person-dark-input {
      background: rgba(255, 255, 255, 0.07) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #fff !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px rgba(0, 0, 0, 0.10);
    }
    .person-dark-input::placeholder {
      color: rgba(255, 255, 255, 0.42) !important;
    }
    .person-dark-input:focus {
      border-color: rgba(255, 255, 255, 0.24) !important;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .person-dark-input:disabled {
      opacity: 0.6;
    }
    .debt-choice {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.78);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
    }
    .debt-choice:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
    }
    .debt-choice.active {
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.96);
      color: #0f172a;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .debt-person-picker {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
    }
    .debt-person-picker:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.14);
    }
    .glass-nav {
      background: rgba(247, 252, 255, 0.86);
      border-top: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 -8px 24px rgba(14, 116, 144, 0.08), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
    }
    .ua-nav-track { position: relative; isolation: isolate; }
    .ua-nav-indicator {
      position: absolute; z-index: 0; top: 0; bottom: 0; left: 0;
      border-radius: 1rem; background: #0f172a;
      box-shadow: 0 8px 20px rgba(15,23,42,.18), inset 0 1px 0 rgba(255,255,255,.08);
      pointer-events: none; overflow: hidden;
    }
    .ua-nav-indicator::after {
      content: ""; position: absolute; top: -80%; bottom: -80%; left: -50%; width: 42%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transform: skewX(-18deg); opacity: 0;
    }
    .ua-nav-indicator-moving { animation: ua-nav-sweep 560ms cubic-bezier(.16,.82,.22,1) both; will-change: transform; transform-origin: center; }
    .ua-nav-indicator-moving::after { opacity: 1; animation: ua-nav-sheen 560ms ease-out both; }
    .ua-nav-label { display: inline-block; transform-origin: center bottom; }
    .ua-nav-label-pop { animation: ua-nav-label-pop 420ms cubic-bezier(.18,.72,.25,1) both; }
    .ua-nav-item {
      position: relative; z-index: 1; display: flex; min-width: 0; flex: 1;
      flex-direction: column; align-items: center; justify-content: center; gap: .25rem;
      border-radius: 1rem; padding: .5rem .5rem; background: transparent;
      -webkit-tap-highlight-color: transparent;
      transition: color 200ms ease, transform 220ms cubic-bezier(.2,.75,.25,1);
    }
    .ua-nav-item:active { transform: scale(.96); }
    .ua-nav-icon { transition: transform 220ms cubic-bezier(.2,.75,.25,1), background-color 220ms ease; }
    .ua-nav-icon-pop { animation: ua-nav-icon-pop 420ms cubic-bezier(.18,.72,.25,1) both; }
    @keyframes ua-nav-sweep {
      0% { transform: var(--ua-nav-from) scale(.94,.92); filter: brightness(.92); }
      48% { transform: var(--ua-nav-to) scale(1.045,1.055); filter: brightness(1.10); }
      70% { transform: var(--ua-nav-to) scale(.99,.99); filter: brightness(1.02); }
      86% { transform: var(--ua-nav-to) scale(1.012,1.015); filter: brightness(1.01); }
      100% { transform: var(--ua-nav-to) scale(1,1); filter: brightness(1); }
    }
    @keyframes ua-nav-sheen { 0% { left: -50%; opacity: 0; } 24% { opacity: 1; } 100% { left: 125%; opacity: 0; } }
    @keyframes ua-nav-icon-pop {
      0% { transform: scale(.76) translateY(2px); }
      52% { transform: scale(1.14) translateY(-2px); }
      74% { transform: scale(.96) translateY(0); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes ua-nav-label-pop {
      0% { opacity: .68; transform: translateY(3px) scale(.92); }
      58% { opacity: 1; transform: translateY(-1px) scale(1.04); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }


    .ai-thinking-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(96, 165, 250, 0.24);
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(239,246,255,0.92), rgba(248,250,252,0.98));
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.08), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    .ai-thinking-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -45%;
      width: 42%;
      background: linear-gradient(110deg, transparent, rgba(255,255,255,0.78), transparent);
      transform: skewX(-18deg);
      animation: ai-card-sheen 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .ai-thinking-text {
      display: inline-block;
      background: linear-gradient(100deg, #64748b 5%, #2563eb 34%, #7dd3fc 48%, #2563eb 62%, #64748b 95%);
      background-size: 240% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: ai-text-shimmer 2.1s linear infinite;
    }
    .ai-thinking-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #60a5fa;
      animation: ai-dot-pulse 1s ease-in-out infinite;
    }
    .ai-thinking-dot:nth-child(2) { animation-delay: .16s; }
    .ai-thinking-dot:nth-child(3) { animation-delay: .32s; }
    @keyframes ai-card-sheen {
      0%, 12% { left: -45%; opacity: 0; }
      28% { opacity: .8; }
      66% { left: 115%; opacity: .45; }
      100% { left: 115%; opacity: 0; }
    }
    @keyframes ai-text-shimmer {
      from { background-position: 100% 0; }
      to { background-position: -140% 0; }
    }
    @keyframes ai-dot-pulse {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-3px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ai-thinking-card::before, .ai-thinking-text, .ai-thinking-dot { animation: none !important; }
    }

    .ai-source-list { display: grid; gap: 8px; margin-top: 12px; }
    .ai-source-card {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px 11px;
      border: 1px solid rgba(148,163,184,.20); border-radius: 15px;
      background: rgba(248,250,252,.92); text-decoration: none;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .ai-source-card:hover { border-color: rgba(96,165,250,.55); background: #eff6ff; transform: translateY(-1px); }
    .ai-source-favicon { width: 28px; height: 28px; border-radius: 9px; background: white; padding: 4px; object-fit: contain; flex: 0 0 auto; border: 1px solid #e2e8f0; }
    .ai-source-title { font-size: 11px; line-height: 1.35; font-weight: 700; color: #0f172a; }
    .ai-source-domain { margin-top: 3px; font-size: 10px; font-weight: 600; color: #2563eb; }
    .ai-source-snippet { margin-top: 4px; font-size: 10px; line-height: 1.45; color: #64748b; }
    .ai-source-heading { display: flex; align-items: center; gap: 6px; color: #64748b; font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .ai-recommendation-card {
      margin: .85rem 0; padding: 14px; border: 1px solid rgba(96,165,250,.24);
      border-radius: 18px; background: linear-gradient(145deg, #ffffff, #f8fbff);
      box-shadow: 0 5px 18px rgba(15,23,42,.035), inset 0 1px 0 #fff;
    }
    .ai-recommendation-card h3 { display: flex; align-items: center; gap: .55rem; margin-top: 0 !important; padding-bottom: 8px; border-bottom: 1px solid #eaf0f7; }
    .ai-recommendation-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9px; background: #eff6ff; color: #2563eb; }
    .ai-recommendation-card h3 strong { flex: 1; }
    .ai-recommendation-card > :last-child { margin-bottom: 0; }
    .ai-web-search-note { margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-size: 10px; line-height: 1.5; }
    .ai-web-search-note.is-limited { background: #fff7ed; color: #9a3412; }
    .ai-followups { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .ai-followup-chip { border: 1px solid #dbeafe; background: #f8fbff; color: #1d4ed8; border-radius: 999px; padding: 7px 10px; font-size: 10px; font-weight: 700; line-height: 1.35; text-align: left; transition: background .15s ease, border-color .15s ease; }
    .ai-followup-chip:hover { background: #eff6ff; border-color: #93c5fd; }
    .ai-markdown { color: #334155; overflow-wrap: anywhere; line-height: 1.72; }
    .ai-markdown p { margin: 0 0 .8rem; }
    .ai-markdown p:last-child { margin-bottom: 0; }
    .ai-markdown h3, .ai-markdown h4 { color: #0f172a; font-weight: 800; line-height: 1.35; letter-spacing: -.025em; margin: 1.1rem 0 .55rem; }
    .ai-markdown h3 { font-size: 1.02rem; }
    .ai-markdown h4 { font-size: .94rem; }
    .ai-markdown ul, .ai-markdown ol { display: grid; gap: .55rem; margin: .65rem 0 1rem; padding: 0; list-style: none; }
    .ai-markdown li { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: .42rem; align-items: start; }
    .ai-markdown .ai-markdown-bullet { display: block; width: 7px; height: 7px; border-radius: 999px; background: #3b82f6; margin: .62em auto 0; box-shadow: 0 0 0 3px #dbeafe; }
    .ai-markdown .ai-markdown-number { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 7px; background: #eff6ff; color: #1d4ed8; font-size: .68rem; font-weight: 800; margin-top: .1rem; }
    .ai-markdown strong { color: #0f172a; font-weight: 800; }
    .ai-markdown em { color: #475569; }
    .ai-markdown a { color: #2563eb; font-weight: 650; text-decoration: underline; text-decoration-color: #bfdbfe; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .ai-markdown code { padding: .12rem .32rem; border-radius: .4rem; background: #f1f5f9; color: #0f172a; font-size: .88em; }
    .ai-markdown blockquote { margin: .8rem 0; padding: .7rem .85rem; border-left: 3px solid #60a5fa; border-radius: 0 .8rem .8rem 0; background: #eff6ff; color: #334155; }
    .ai-markdown hr { margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0; }
    .ai-chat-disclaimer { padding: 10px 8px 2px; color: #94a3b8; text-align: center; font-size: 10px; line-height: 1.55; }
  
    .ua-status-screen {
      background:
        radial-gradient(ellipse at 50% 42%, rgba(219,234,254,0.50) 0%, rgba(248,250,252,0.88) 42%, #f8fafc 78%),
        #f8fafc;
      isolation: isolate;
    }
    .ua-status-glow {
      position: absolute;
      width: 18rem;
      height: 18rem;
      border-radius: 9999px;
      filter: blur(54px);
      pointer-events: none;
      opacity: 0.52;
    }
    .ua-status-glow-one { top: -8rem; left: -8rem; background: rgba(147,197,253,0.28); }
    .ua-status-glow-two { right: -9rem; bottom: -10rem; background: rgba(191,219,254,0.44); }
    .ua-loading-screen {
      color: #f8fafc;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(30,64,175,.34) 0%, rgba(15,23,42,0) 42%),
        radial-gradient(ellipse at 85% 88%, rgba(8,145,178,.12) 0%, rgba(8,145,178,0) 32%),
        linear-gradient(148deg, #070d1e 0%, #0f172a 48%, #111d3a 100%);
      isolation: isolate;
    }
    .ua-loading-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    .ua-loading-screen .ua-status-glow {
      width: 22rem; height: 22rem; filter: blur(72px); opacity: .8;
      animation: ua-splash-drift 8s ease-in-out infinite alternate;
    }
    .ua-loading-screen .ua-status-glow-one { top: -11rem; left: -10rem; background: rgba(37,99,235,.28); }
    .ua-loading-screen .ua-status-glow-two { right: -12rem; bottom: -12rem; background: rgba(6,182,212,.18); animation-delay: -3s; }
    .ua-splash-content {
      width: 100%; max-width: 26rem; padding: 2rem .5rem;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .ua-splash-logo-shell {
      position: relative; display: flex; width: 136px; height: 136px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(191,219,254,.27); border-radius: 38px;
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.045));
      box-shadow: 0 28px 70px rgba(0,0,0,.28), 0 0 0 8px rgba(147,197,253,.035), inset 0 1px 0 rgba(255,255,255,.18);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      animation: ua-splash-logo-arrive 700ms cubic-bezier(.2,.75,.25,1) both, ua-splash-logo-breathe 3.2s ease-in-out 700ms infinite;
    }
    .ua-splash-logo-shell::after {
      content: ""; position: absolute; inset: -8px; border: 1px solid rgba(125,211,252,.10);
      border-radius: 45px; pointer-events: none;
    }
    .ua-app-mark {
      display: block; width: 108px; height: 108px; border-radius: 28px;
      object-fit: cover; box-shadow: 0 12px 30px rgba(0,0,0,.24), 0 0 28px rgba(59,130,246,.16);
    }
    .ua-splash-brand { margin-top: 2rem; font-size: 11px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; color: #93c5fd; }
    .ua-splash-title { margin-top: .65rem; color: #fff; font-size: clamp(1.8rem, 7vw, 2.25rem); font-weight: 800; letter-spacing: -.045em; line-height: 1.12; }
    .ua-splash-subtitle { margin-top: .75rem; max-width: 19rem; color: rgba(226,232,240,.76); font-size: .96rem; line-height: 1.6; }
    .ua-splash-loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 18px; margin-top: 2rem; color: rgba(203,213,225,.78); font-size: .78rem; font-weight: 600; letter-spacing: .015em; }
    .ua-loading-dots { display: flex; align-items: center; justify-content: center; gap: 7px; }
    .ua-loading-dots span {
      display: block; width: 7px; height: 7px; border-radius: 9999px; background: #93c5fd;
      opacity: .38; transform: translateY(0) scale(.8); animation: ua-dot-bounce 850ms ease-in-out infinite;
    }
    .ua-loading-dots span:nth-child(2) { animation-delay: 150ms; }
    .ua-loading-dots span:nth-child(3) { animation-delay: 300ms; }
    .ua-splash-progress { position: relative; overflow: hidden; width: 158px; height: 3px; margin-top: 1rem; border-radius: 999px; background: rgba(148,163,184,.17); }
    .ua-splash-progress span {
      display: block; width: 38%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #60a5fa, #67e8f9); box-shadow: 0 0 14px rgba(96,165,250,.55);
      animation: ua-splash-progress 1.55s ease-in-out infinite;
    }
    .ua-splash-footer {

    const userId=currentUser?currentUser.id:null;

      if(sessionResult.error)throw sessionResult.error;
      if(!sessionResult.data.session||sessionResult.data.session.user.id!==userId)return;
      const savedState=JSON.parse(snapshot);
      const result=await supabaseClient.rpc("liveos_sync_app_state",{p_state:savedState});
      if(result.error)throw result.error;
      const reminderResult=await supabaseClient.rpc("liveos_sync_reminders",{p_reminders:savedState.reminders||[]});
      if(reminderResult.error)throw reminderResult.error;
      if(currentUser&&currentUser.id===userId){syncStatus="saved";updateSyncStatusUI();scheduleGoogleCalendarSync(1800);}
    }).catch(error=>{
      console.error("LiveOS cloud sync failed.",error);
      if(currentUser&&currentUser.id===userId){syncStatus="error";updateSyncStatusUI();}
    });
  };

  function openProductPhotoDB(){

  async function compressProductPhoto(file){
    if(!file||!file.type||!file.type.startsWith("image/"))throw new Error("Bitte wähle eine Bilddatei aus.");
    if(file.size>12*1024*1024)throw new Error("Das Originalfoto darf höchstens 12 MB groß sein.");
    let source=null,sourceUrl=null;
    try{
      if("createImageBitmap" in window)source=await createImageBitmap(file);
      else{
        sourceUrl=URL.createObjectURL(file);
        source=await new Promise((resolve,reject)=>{
          const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("Das Bild konnte nicht gelesen werden."));img.src=sourceUrl;
        });
      }
      const width=source.width||source.naturalWidth,height=source.height||source.naturalHeight;
      if(!width||!height)throw new Error("Das Bild hat kein gültiges Format.");
      const scale=Math.min(1,1100/Math.max(width,height)),canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
      const context=canvas.getContext("2d",{alpha:false});
      if(!context)throw new Error("Bildkomprimierung ist auf diesem Gerät nicht verfügbar.");
      context.drawImage(source,0,0,canvas.width,canvas.height);
      let blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",0.72));
      if(!blob)blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.72));
      if(!blob)throw new Error("Das Foto konnte nicht komprimiert werden.");
      return blob;
    }finally{
      if(source&&typeof source.close==="function")source.close();
      if(sourceUrl)URL.revokeObjectURL(sourceUrl);
    }
  }

  function defaultReminderLocal(){
    const date=new Date(Date.now()+60*60*1000);
    date.setMinutes(Math.ceil(date.getMinutes()/15)*15,0,0);
    const pad=n=>String(n).padStart(2,"0");
    return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate())+"T"+pad(date.getHours())+":"+pad(date.getMinutes());
  }
  function nextReminderDate(value,repeat){
    const date=new Date(value),now=Date.now(),originalDay=date.getDate();
    const advance=()=>{
      if(repeat==="daily")date.setDate(date.getDate()+1);
      else if(repeat==="weekly")date.setDate(date.getDate()+7);
      else if(repeat==="monthly"){
        date.setDate(1);date.setMonth(date.getMonth()+1);
        const lastDay=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
        date.setDate(Math.min(originalDay,lastDay));
      }
    };
    do{advance();}while(date.getTime()<=now);
    return date.toISOString();
  }

  async function checkDueReminders(){
    if(reminderCheckBusy||!currentUser||!("Notification" in window)||Notification.permission!=="granted")return;
    const now=Date.now();
    const due=(data.reminders||[]).filter(r=>r.enabled!==false&&!r.sentAt&&Number.isFinite(Date.parse(r.scheduledAt))&&Date.parse(r.scheduledAt)<=now);
    if(!due.length)return;
    reminderCheckBusy=true;
    try{
      const registration=await ensureReminderServiceWorker(),userId=currentUser.id;
      let changed=false;
      for(const reminder of due){
        if(!currentUser||currentUser.id!==userId)break;
        await registration.showNotification("LiveOS · "+reminder.title,{
          body:reminder.message||"Du hast eine Erinnerung.",
          icon:"./assets/liveos-icon-192.png?v=liveos-v4",
          tag:"liveos-reminder-"+reminder.id,
          data:{url:"./"}
        });
        if(reminder.repeat&&reminder.repeat!=="none"){
          reminder.scheduledAt=nextReminderDate(reminder.scheduledAt,reminder.repeat);reminder.sentAt=null;
        }else{
          reminder.enabled=false;reminder.sentAt=new Date().toISOString();
        }

        const firstDue=due[0];

        if(connected||error){
          url.searchParams.delete("calendar_connected");
          url.searchParams.delete("calendar_error");
          history.replaceState({},document.title,url.pathname+url.search+url.hash);
          if(connected)showLiveOSFeedback("success","Google Kalender verbunden","Die erste Synchronisierung wurde gestartet.");

  function startRealtimeSync(userId){

  async function hydrateCloudState(userId,token){
    try{
      const loaded=await supabaseClient.rpc("liveos_load_app_state");
      if(loaded.error)throw loaded.error;
      if(token!==authHydrationToken||!currentUser||currentUser.id!==userId)return;
      const response=loaded.data||{};
      if(response.initialized&&response.state&&typeof response.state==="object"){
        data=normalizeState(response.state);
        try{localStorage.setItem(dataStorageKey(),JSON.stringify(data));}catch(error){console.warn("LiveOS cache update failed.",error);}
      }else{
        // First login: import the previous local-only data once, then keep the account isolated.
        let raw=null,legacyKey=null;
        const accountKey=STORAGE_KEY+":user:"+userId;
        raw=localStorage.getItem(accountKey);
        if(!raw){
          raw=localStorage.getItem(STORAGE_KEY);
          if(raw)legacyKey=STORAGE_KEY;
        }
        if(!raw){
          raw=localStorage.getItem(STORAGE_KEY+":guest");
          if(raw)legacyKey=STORAGE_KEY+":guest";
        }
        try{data=raw?normalizeState(JSON.parse(raw)):defaultState();}catch(_){data=defaultState();}
        const migrated=await supabaseClient.rpc("liveos_sync_app_state",{p_state:data});
        if(migrated.error)throw migrated.error;
        if(token!==authHydrationToken||!currentUser||currentUser.id!==userId)return;
        try{localStorage.setItem(accountKey,JSON.stringify(data));}catch(error){console.warn("LiveOS cache update failed.",error);}
        if(legacyKey)localStorage.removeItem(legacyKey);
      }
      if(token!==authHydrationToken||!currentUser||currentUser.id!==userId)return;
      syncStatus="saved";
      startRealtimeSync(userId);
    }catch(error){
      console.error("LiveOS cloud data could not be loaded.",error);
      if(token===authHydrationToken&&currentUser&&currentUser.id===userId){
        data=loadState();
        syncStatus="error";
      }
    }finally{
      if(token===authHydrationToken&&currentUser&&currentUser.id===userId){
        authReady=true;
        render();
        initializeGoogleCalendarSync(userId);
      }
    }
  }
  function applyAuthSession(session){
    const nextUser=session&&session.user?session.user:null;
    const oldId=currentUser?currentUser.id:null;
    const nextId=nextUser?nextUser.id:null;
    if(oldId===nextId){
      if(!nextId&&!authReady){authReady=true;render();}
      return;
    }
    authHydrationToken++;
    clearGoogleCalendarSyncTimers();
    calendarSyncConnected=false;
    calendarSyncConfigured=null;
    stopRealtimeSync();
    currentUser=nextUser;
    if(!currentUser){
      if(reminderWatcher){clearInterval(reminderWatcher);reminderWatcher=null;}
      clearGoogleCalendarSyncTimers();calendarSyncConnected=false;
      data=defaultState();
      syncStatus="idle";
      authReady=true;
      render();
      return;
    }
    data=defaultState();
    authReady=false;
    syncStatus="loading";
    render();
    const token=authHydrationToken;
    Promise.resolve().then(()=>hydrateCloudState(nextId,token));
  }

  function calendarEventTiming(event){
    const date=String(event&&event.date||"");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
    const parts=date.split("-").map(Number),year=parts[0],month=parts[1],day=parts[2];
    const time=String(event&&event.time||"").trim();
    const timed=/^\d{2}:\d{2}$/.test(time);
    const bits=timed?time.split(":").map(Number):[0,0];
    const start=new Date(year,month-1,day,bits[0],bits[1],0,0);
    if(!Number.isFinite(start.getTime())||start.getFullYear()!==year||start.getMonth()!==month-1||start.getDate()!==day)return null;
    return {allDay:!timed,start,end:timed?new Date(start.getTime()+60*60*1000):new Date(year,month-1,day+1)};
  }

    return String(value.getFullYear())+calendarPad(value.getMonth()+1)+calendarPad(value.getDate());

  function calendarLocalStamp(value){
    return calendarLocalDate(value)+"T"+calendarPad(value.getHours())+calendarPad(value.getMinutes())+"00";
  }
  function calendarUtcStamp(value){
    return value.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  }
  function calendarIcsEscape(value){
    return String(value||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
  }

      if(!timing)return;
      const uid=(String(event.id||("event-"+index)).replace(/[^A-Za-z0-9_.-]/g,"")||("event-"+index))+"@liveos";
      const details=[event.type||"Termin",event.note||""].filter(Boolean).join("\n");
      lines.push("BEGIN:VEVENT");
      lines.push("UID:"+uid);
      lines.push("DTSTAMP:"+calendarUtcStamp(new Date()));
      lines.push("SUMMARY:"+calendarIcsEscape(event.title||"LiveOS-Termin"));
      if(details)lines.push("DESCRIPTION:"+calendarIcsEscape(details));
      if(timing.allDay){
        lines.push("DTSTART;VALUE=DATE:"+calendarLocalDate(timing.start));
        lines.push("DTEND;VALUE=DATE:"+calendarLocalDate(timing.end));
      }else{
        lines.push("DTSTART:"+calendarUtcStamp(timing.start));
        lines.push("DTEND:"+calendarUtcStamp(timing.end));
      }
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n")+"\r\n";
  }
  function downloadCalendarIcs(events){
    const list=(Array.isArray(events)?events:[events]).filter(Boolean);
    if(!list.length){window.alert("Es gibt noch keine Termine zum Exportieren.");return;}
    const text=calendarIcsText(list);
    if(!text.includes("BEGIN:VEVENT")){window.alert("Die Termine enthalten kein gültiges Datum.");return;}
    const blob=new Blob(["\uFEFF",text],{type:"text/calendar;charset=utf-8"});
    const objectUrl=URL.createObjectURL(blob),anchor=document.createElement("a");
    anchor.href=objectUrl;
    anchor.download="LiveOS-Kalender.ics";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),1500);
  }
  function googleCalendarUrl(event){
    const timing=calendarEventTiming(event);
    if(!timing)return "https://calendar.google.com/calendar/u/0/r";
    const url=new URL("https://calendar.google.com/calendar/render");
    url.searchParams.set("action","TEMPLATE");
    url.searchParams.set("text",String(event.title||"LiveOS-Termin"));
    url.searchParams.set("details",[event.type||"Termin",event.note||""].filter(Boolean).join("\n"));
    url.searchParams.set("dates",timing.allDay
      ?calendarLocalDate(timing.start)+"/"+calendarLocalDate(timing.end)
      :calendarLocalStamp(timing.start)+"/"+calendarLocalStamp(timing.end));
    if(!timing.allDay)url.searchParams.set("ctz","Europe/Berlin");
    return url.toString();
  }

  function appHTML(){

  }

  function showLiveOSFeedback(kind,title,message,duration){
    const id=++liveOSFeedbackSequence;
    liveOSFeedback={id,kind,title,message};
    if(liveOSFeedbackTimer)clearTimeout(liveOSFeedbackTimer);
    liveOSFeedbackTimer=setTimeout(()=>{
      if(!liveOSFeedback||liveOSFeedback.id!==id)return;
      liveOSFeedback=null;liveOSFeedbackTimer=null;
      if(currentUser&&authReady&&!tutorialOpen)render();
    },duration||4200);
  }
  function liveOSFeedbackHTML(){
    if(!liveOSFeedback||tutorialOpen||!currentUser)return "";
    const item=liveOSFeedback;
    const icons={success:"check-circle-2",reminder:"bell-ring",finance:"wallet-cards",calendar:"calendar-check",plugin:"puzzle"};
    const artwork=item.kind==="plugin"
      ?'<span class="liveos-feedback-plugin-pieces">'+icon("puzzle","h-5 w-5")+icon("puzzle","h-5 w-5")+'</span>'
      :icon(icons[item.kind]||"check-circle-2","h-6 w-6");
    return '<div class="liveos-feedback-wrap liveos-feedback-'+esc(item.kind||"success")+'" role="status" aria-live="polite"><div class="liveos-feedback-card"><div class="liveos-feedback-icon">'+artwork+'</div><div class="liveos-feedback-copy"><strong>'+esc(item.title)+'</strong><span>'+esc(item.message||"")+'</span></div></div><div class="liveos-feedback-progress"><span></span></div></div>';
  }
  function render(){
    if(!authReady){
      if(!root.querySelector(".liveos-boot-screen"))root.innerHTML=appLoadingHTML();
    }
    else if(!currentUser||authMode==="update-password")root.innerHTML=authHTML();
    else root.innerHTML=appHTML()+(bankModalOpen?bankModal():"")+(settingsOpen?settingsHTML():"")+(tutorialOpen?onboardingHTML():"")+liveOSFeedbackHTML();
    if(window.lucide&&typeof window.lucide.createIcons==="function")window.lucide.createIcons();
    if(currentUser&&tutorialOpen&&tutorialStep===7){const target=document.getElementById("tutorial-shopping-input");if(target){target.scrollIntoView({behavior:"smooth",block:"center"});target.focus({preventScroll:true});}}
    refreshProductPhotoImages();
    if(currentUser)startReminderWatcher();
    animatePage=false;navFrom=null;
  }
  function finishTutorial(){tutorialOpen=false;tutorialStep=0;tutorialListId=null;localStorage.setItem(TUTORIAL_KEY,"true");render();}
  function setTutorialStep(step){
    tutorialStep=Math.max(0,Math.min(8,step));
    const page=tutorialStep===2?"finances":tutorialStep===3?"calendar":tutorialStep===4?"lists":tutorialStep>=5?"shopping":"home";
    activePage=page;localStorage.setItem("liveos-active-page-v1",page);render();
  }
  function openTutorialShoppingList(){
    data.lists=Array.isArray(data.lists)?data.lists:[];
    let list=data.lists.find(x=>String(x.title||"").trim().toLowerCase()==="einkauf");
    if(!list){list={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:"Einkauf",items:[]};data.lists.push(list);save();}
    if(!Array.isArray(list.items))list.items=[];
    tutorialListId=list.id;setTutorialStep(7);
    setTimeout(()=>{const target=document.getElementById("tutorial-shopping-input");if(target){target.scrollIntoView({behavior:"smooth",block:"center"});target.focus({preventScroll:true});}},60);
  }

  document.addEventListener("click",function(event){
    const el=event.target.closest("[data-action]");if(!el)return;
    const action=el.dataset.action;
    if(action==="auth-mode"){authMode=el.dataset.mode||"login";authMessage="";authMessageType="info";render();return;}
    if(action==="sign-out"||action==="settings-sign-out"){settingsOpen=false;signOutLiveOS();return;}
    if(action==="open-settings"){settingsOpen=true;render();return;}
    if(action==="close-settings"){settingsOpen=false;render();return;}
    if(action==="settings-security"){settingsOpen=false;bankModalOpen=true;render();return;}
    if(action==="navigate"||action==="quick"){
      const page=el.dataset.page;if(pages.includes(page)){if(page!==activePage){navFrom=activePage;animatePage=true;}activePage=page;localStorage.setItem("liveos-active-page-v1",page);render();}
      return;
    }
    if(action==="tutorial-skip"||action==="tutorial-finish"){finishTutorial();return;}
    if(action==="tutorial-prev"){setTutorialStep(tutorialStep===8?7:tutorialStep-1);return;}
    if(action==="tutorial-next"){setTutorialStep(tutorialStep+1);return;}
    if(action==="tutorial-skip-step"){setTutorialStep(tutorialStep+1);return;}
    if(action==="tutorial-shopping"){setTutorialStep(6);return;}
    if(action==="tutorial-open-list"){openTutorialShoppingList();return;}
    if(action==="bank-info"){bankModalOpen=true;render();return;}
    if(action==="close-bank"){bankModalOpen=false;render();return;}
    if(action==="enable-notifications"){enableLiveOSNotifications();return;}
    if(action==="delete-reminder"){
      data.reminders=(data.reminders||[]).filter(x=>x.id!==el.dataset.id);save();render();return;
    }
    if(action==="delete-product-memory"){
      const userId=currentUser&&currentUser.id,product=(data.productMemories||[]).find(x=>x.id===el.dataset.id);
      data.productMemories=(data.productMemories||[]).filter(x=>x.id!==el.dataset.id);
      if(userId&&product)deleteProductPhoto(product.id,userId).catch(error=>console.warn("Local photo cleanup failed.",error));
      save();render();return;
    }
    if(action==="buy-again"){
      const product=(data.productMemories||[]).find(x=>x.id===el.dataset.id);
      if(product){
        data.lists=Array.isArray(data.lists)?data.lists:[];
        let list=data.lists.find(x=>String(x.title||"").trim().toLowerCase()==="einkauf");
        if(!list){list={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:"Einkauf",items:[]};data.lists.push(list);}
        list.items=Array.isArray(list.items)?list.items:[];
        list.items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:product.title+(product.brand?" · "+product.brand:""),done:false});
        showLiveOSFeedback("success","Zur Einkaufsliste hinzugefügt",product.title);
        save();activePage="shopping";localStorage.setItem("liveos-active-page-v1",activePage);render();
      }
      return;
    }
    if(action==="calendar-google-connect"){connectGoogleCalendar();return;}
    if(action==="calendar-sync-now"){runGoogleCalendarSync(true);return;}
    if(action==="calendar-google-disconnect"){disconnectGoogleCalendar();return;}
    if(action==="toggle-plugin"){
      const id=String(el.dataset.id||"");
      if(!shoppingPluginCatalog.some(plugin=>plugin.id===id))return;
      data.enabledPlugins=Array.isArray(data.enabledPlugins)?data.enabledPlugins:[];
      const active=data.enabledPlugins.includes(id);
      data.enabledPlugins=active?data.enabledPlugins.filter(x=>x!==id):[...data.enabledPlugins,id];
      if(active)showLiveOSFeedback("success","Plugin entfernt",shoppingPluginCatalog.find(plugin=>plugin.id===id).name+" ist nicht mehr in deiner Plugin-Zentrale.");
      else showLiveOSFeedback("plugin","Plugin hinzugefügt",shoppingPluginCatalog.find(plugin=>plugin.id===id).name+" ist jetzt in LiveOS verfügbar.");
      save();
      if(id==="calendar-link"){
        if(active){clearGoogleCalendarSyncTimers();calendarSyncConnected=false;}
        else if(currentUser)initializeGoogleCalendarSync(currentUser.id);

      render();return;

    if(action==="calendar-download-ics"){

    if(action==="calendar-export-all"){downloadCalendarIcs(data.events||[]);return;}
    if(action==="delete-offer"){
      data.offers=(Array.isArray(data.offers)?data.offers:[]).filter(offer=>offer.id!==el.dataset.id);save();render();return;
    }

      const offer=(Array.isArray(data.offers)?data.offers:[]).find(item=>item.id===el.dataset.id);

        data.lists=Array.isArray(data.lists)?data.lists:[];

        if(!list){list={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:"Einkauf",items:[]};data.lists.push(list);}
        list.items=Array.isArray(list.items)?list.items:[];
        list.items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:String(offer.product||offer.title),done:false});
        showLiveOSFeedback("success","Zur Einkaufsliste hinzugefügt",offer.product||offer.title);
        activePage="shopping";localStorage.setItem("liveos-active-page-v1",activePage);save();render();
      }
      return;
    }
    if(action==="delete-loyalty-card"){
      data.loyaltyCards=(data.loyaltyCards||[]).filter(x=>x.id!==el.dataset.id);save();render();return;
    }
    if(action==="delete-expense"){data.expenses=data.expenses.filter(x=>x.id!==el.dataset.id);save();render();return;}
    if(action==="delete-event"){
      const eventToDelete=data.events.find(x=>x.id===el.dataset.id);
      if(eventToDelete&&eventToDelete.googleEventId){
        data.calendarPendingDeletes=Array.isArray(data.calendarPendingDeletes)?data.calendarPendingDeletes:[];
        if(!data.calendarPendingDeletes.includes(eventToDelete.googleEventId))data.calendarPendingDeletes.push(eventToDelete.googleEventId);
      }
      data.events=data.events.filter(x=>x.id!==el.dataset.id);save();render();return;
    }
    if(action==="toggle-task"){

    }
    if(action==="delete-task"){data.tasks=data.tasks.filter(x=>x.id!==el.dataset.id);save();render();return;}
    if(action==="delete-note"){data.notes=data.notes.filter(x=>x.id!==el.dataset.id);save();render();return;}

      const list=(data.lists||[]).find(x=>x.id===el.dataset.listId);
      if(list){list.items=(list.items||[]).filter(x=>x.id!==el.dataset.itemId);save();render();}return;

      a.href=url;a.download="liveos-daten-"+todayISO()+".json";a.click();URL.revokeObjectURL(url);return;
    }
    if(action==="reset-data"){
      if(confirm("Möchtest du wirklich alle LiveOS-Daten dieses Kontos löschen?")){const userId=currentUser&&currentUser.id;data=defaultState();if(userId)clearProductPhotosForUser(userId).catch(error=>console.warn("Local photo cleanup failed.",error));save();render();}return;
    }
  });
  document.addEventListener("submit",async function(event){
    const form=event.target;if(!form||!form.id)return;
    if(form.id==="profile-form"){
      event.preventDefault();const displayName=String(new FormData(form).get("display_name")||"").trim().slice(0,80);
      try{const result=await supabaseClient.auth.updateUser({data:{display_name:displayName}});if(result.error)throw result.error;currentUser=result.data.user||currentUser;settingsOpen=false;showLiveOSFeedback("success","Profil aktualisiert",displayName||"Dein Anzeigename wurde entfernt.");render();}
      catch(error){window.alert(error&&error.message?error.message:"Dein Profil konnte nicht gespeichert werden.");}return;
    }
    if(form.id==="settings-password-form"){
      event.preventDefault();const fd=new FormData(form),password=String(fd.get("password")||""),confirmPassword=String(fd.get("confirm_password")||"");
      if(password.length<8){window.alert("Bitte verwende mindestens 8 Zeichen.");return;}if(password!==confirmPassword){window.alert("Die beiden Passwörter stimmen nicht überein.");return;}
      try{const result=await supabaseClient.auth.updateUser({password});if(result.error)throw result.error;settingsOpen=false;showLiveOSFeedback("success","Passwort aktualisiert","Dein neues Passwort ist gespeichert.");render();}
      catch(error){window.alert(error&&error.message?error.message:"Dein Passwort konnte nicht geändert werden.");}return;
    }
    if(form.id==="tutorial-income-form"){
      event.preventDefault();
      const amount=Number(new FormData(form).get("amount"));if(!Number.isFinite(amount)||amount<0)return;data.monthlyIncome=amount;save();setTutorialStep(3);return;
    }
    if(form.id==="tutorial-event-form"){
      event.preventDefault();
      const fd=new FormData(form),title=String(fd.get("title")||"").trim(),date=String(fd.get("date")||"");if(!title||!date)return;
      data.events.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,type:"Termin",date,time:String(fd.get("time")||""),note:""});save();setTutorialStep(4);return;
    }
    if(form.id==="tutorial-task-form"){
      event.preventDefault();
      const fd=new FormData(form),title=String(fd.get("title")||"").trim();if(!title)return;
      data.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,due:String(fd.get("due")||""),priority:"Normal",done:false});save();setTutorialStep(5);return;
    }
    if(form.id==="auth-form"){
      event.preventDefault();
      if(authBusy)return;
      const fd=new FormData(form);
      const email=String(fd.get("email")||"").trim().toLowerCase();
      authEmailDraft=email;
      authBusy=true;authMessage="";authMessageType="info";render();
      try{
        if(authMode==="signup"){
          const password=String(fd.get("password")||"");
          const displayName=String(fd.get("display_name")||"").trim().slice(0,80);
          if(password.length<8)throw new Error("Bitte verwende mindestens 8 Zeichen für dein Passwort.");
          const result=await supabaseClient.auth.signUp({
            email,password,
            options:{data:{display_name:displayName},emailRedirectTo:authRedirectUrl()}
          });
          if(result.error)throw result.error;
          if(result.data.session){
            authMode="login";authMessage="Dein Konto wurde erstellt und du bist angemeldet.";
          }else{
            authMode="login";authMessage="Fast geschafft! Bitte öffne den Bestätigungslink in deiner E-Mail und melde dich danach an.";
          }
        }else if(authMode==="forgot"){
          const result=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:authRedirectUrl()});
          if(result.error)throw result.error;
          authMode="login";authMessage="Falls ein Konto zu dieser Adresse gehört, erhältst du eine E-Mail mit einem Link zum Zurücksetzen des Passworts.";
        }else if(authMode==="update-password"){
          const password=String(fd.get("new_password")||"");
          const confirmPassword=String(fd.get("confirm_password")||"");
          if(password.length<8)throw new Error("Bitte verwende mindestens 8 Zeichen für dein neues Passwort.");
          if(password!==confirmPassword)throw new Error("Die beiden Passwörter stimmen nicht überein.");
          const result=await supabaseClient.auth.updateUser({password});
          if(result.error)throw result.error;
          authMode="login";authMessage="Dein Passwort wurde geändert.";
        }else{
          const password=String(fd.get("password")||"");
          const result=await supabaseClient.auth.signInWithPassword({email,password});
          if(result.error)throw result.error;
          applyAuthSession(result.data.session);
        }
      }catch(error){
        authMessage=error&&error.message?error.message:"Das hat leider nicht funktioniert. Bitte versuche es erneut.";
        authMessageType="error";
      }finally{
        authBusy=false;
        render();
      }
      return;
    }
    event.preventDefault();const fd=new FormData(form);

    if(form.id==="reminder-form"){
      const title=String(fd.get("title")||"").trim(),localDate=String(fd.get("scheduledAt")||"");
      const scheduledAt=new Date(localDate);
      if(!title||!localDate||!Number.isFinite(scheduledAt.getTime()))return;
      if(scheduledAt.getTime()<=Date.now()){alert("Bitte wähle einen Zeitpunkt in der Zukunft.");return;}
      data.reminders=data.reminders||[];
      data.reminders.push({
        id:crypto.randomUUID(),title,message:String(fd.get("message")||"").trim(),
        scheduledAt:scheduledAt.toISOString(),repeat:String(fd.get("repeat")||"none"),
        enabled:true,sentAt:null,createdAt:Date.now()
      });
      showLiveOSFeedback("success","Erinnerung gespeichert",title+" · "+new Intl.DateTimeFormat("de-DE",{dateStyle:"medium",timeStyle:"short"}).format(scheduledAt));
      save();render();return;
    }
    if(form.id==="product-memory-form"){
      const title=String(fd.get("title")||"").trim();if(!title)return;
      const id=crypto.randomUUID(),photo=fd.get("photo");
      if(photo&&photo.size){
        try{
          const compressed=await compressProductPhoto(photo);
          await storeProductPhoto(id,compressed);
        }catch(error){
          alert(error&&error.message?error.message:"Das Foto konnte nicht lokal gespeichert werden.");return;
        }
      }
      data.productMemories=data.productMemories||[];
      data.productMemories.push({
        id,title,brand:String(fd.get("brand")||"").trim(),
        store:String(fd.get("store")||"").trim(),
        note:String(fd.get("note")||"").trim(),
        savedAt:Date.now(),photoKey:photo&&photo.size?id:null
      });
      showLiveOSFeedback("success","Produkt gemerkt",title);
      save();render();return;
    }
    if(form.id==="offer-form"){
      const title=String(fd.get("title")||"").trim();if(!title)return;
      const rawUrl=String(fd.get("url")||"").trim();let safeUrl="";
      if(rawUrl){
        try{const parsed=new URL(rawUrl);if(parsed.protocol!=="https:"&&parsed.protocol!=="http:")throw new Error("Bitte einen gültigen http- oder https-Link verwenden.");safeUrl=parsed.href;}
        catch(error){window.alert(error&&error.message?error.message:"Bitte einen gültigen Angebots-Link eingeben.");return;}
      }
      data.offers=Array.isArray(data.offers)?data.offers:[];
      data.offers.push({
        id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
        shop:String(fd.get("shop")||"Andere"),title,benefit:String(fd.get("benefit")||"").trim(),
        product:String(fd.get("product")||"").trim(),validUntil:String(fd.get("validUntil")||""),
        url:safeUrl,note:String(fd.get("note")||"").trim(),createdAt:Date.now()
      });
      showLiveOSFeedback("success","Angebot gespeichert",title);save();render();return;
    }
    if(form.id.startsWith("loyalty-points-form-")){
      const cardId=form.id.slice("loyalty-points-form-".length),card=(data.loyaltyCards||[]).find(item=>String(item.id)===cardId);
      const rawPoints=String(fd.get("points")||"").trim();
      if(!card||!rawPoints)return;
      const points=Number(rawPoints);if(!Number.isFinite(points)||points<0)return;
      card.points=points;card.updatedAt=Date.now();
      showLiveOSFeedback("success","Punktestand aktualisiert",card.provider);save();render();return;
    }
    if(form.id==="loyalty-card-form"){
      const provider=String(fd.get("provider")||"Andere");
      const cardNumber=String(fd.get("cardNumber")||"").trim();
      const pointsValue=String(fd.get("points")||"").trim();
      const points=pointsValue===""?null:Number(pointsValue);
      data.loyaltyCards=data.loyaltyCards||[];
      data.loyaltyCards.push({
        id:crypto.randomUUID(),provider,cardNumber,
        points:Number.isFinite(points)?points:null,
        label:String(fd.get("label")||"").trim(),createdAt:Date.now()
      });
      showLiveOSFeedback("success","Bonuskarte gespeichert",provider);
      save();render();return;
    }
    if(form.id==="salary-form"){
      const salary=Number(fd.get("salary"));if(Number.isFinite(salary)&&salary>=0){data.monthlyIncome=salary;showLiveOSFeedback("finance","Einnahmen aktualisiert","Dein Monatsbetrag wurde übernommen.");save();render();}return;
    }
    if(form.id==="expense-form"){
      const amount=Number(fd.get("amount"));if(!Number.isFinite(amount)||amount<=0)return;
      const expenseTitle=String(fd.get("title")||"").trim();
      data.expenses.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:expenseTitle,amount,category:String(fd.get("category")||"Sonstiges"),date:String(fd.get("date")||todayISO())});
      showLiveOSFeedback("finance","Ausgabe gespeichert",expenseTitle||"Deine neue Ausgabe");
      save();render();return;
    }
    if(form.id==="event-form"){
      const title=String(fd.get("title")||"").trim();if(!title)return;
      data.events.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,type:String(fd.get("type")||"Termin"),date:String(fd.get("date")||todayISO()),time:String(fd.get("time")||""),note:String(fd.get("note")||"").trim()});
      showLiveOSFeedback("calendar","Im Kalender gespeichert",title);
      save();render();return;
    }
    if(form.id==="task-form"){
      const title=String(fd.get("title")||"").trim();if(!title)return;
      data.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,due:String(fd.get("due")||""),priority:String(fd.get("priority")||"Normal"),done:false});
      showLiveOSFeedback("success","Aufgabe hinzugefügt",title);
      save();render();return;
    }
    if(form.id==="shopping-list-form"){
      const title=String(fd.get("item")||"").trim();if(!title)return;
      data.lists=Array.isArray(data.lists)?data.lists:[];
      let list=data.lists.find(x=>String(x.title||"").trim().toLowerCase()==="einkauf");
      if(!list){list={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:"Einkauf",items:[]};data.lists.push(list);}
      list.items=Array.isArray(list.items)?list.items:[];
      list.items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,done:false});
      const tutorialShoppingAdded=tutorialOpen&&tutorialStep===7;
      if(!tutorialShoppingAdded)showLiveOSFeedback("success","Auf Einkaufsliste gesetzt",title);
      save();if(tutorialShoppingAdded){setTutorialStep(8);return;}render();return;
    }
    if(form.id==="list-form"){
      const title=String(fd.get("title")||"").trim();if(!title)return;
      data.lists=data.lists||[];data.lists.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,items:[]});showLiveOSFeedback("success","Liste erstellt",title);save();render();return;
    }
    if(form.id.startsWith("list-item-form-")){
      const listId=form.id.slice("list-item-form-".length),title=String(fd.get("item")||"").trim(),list=(data.lists||[]).find(x=>x.id===listId);
      if(!list||!title)return;list.items=list.items||[];list.items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,done:false});
      const tutorialItemAdded=tutorialOpen&&tutorialStep===3&&String(listId)===String(tutorialListId);
      if(!tutorialItemAdded)showLiveOSFeedback("success","Eintrag hinzugefügt",title);
      save();if(tutorialItemAdded){tutorialStep=4;render();return;}render();return;
    }
    if(form.id==="note-form"){
      const title=String(fd.get("title")||"").trim(),body=String(fd.get("body")||"").trim();if(!title||!body)return;
      data.notes.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,body,createdAt:Date.now()});
      showLiveOSFeedback("success","Notiz gespeichert",title);
      save();render();return;
    }
  });
  render();
})();

</script>
</body>
</html>
