<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiveOS">
<meta name="description" content="LiveOS – Mach dir dein Leben einfach. Finanzen, Kalender, Listen und Notizen an einem Ort.">
<link rel="manifest" href="./manifest.webmanifest?v=liveos-v1">
<link rel="icon" type="image/svg+xml" href="./assets/liveos-icon.svg?v=liveos-v1">
<link rel="apple-touch-icon" href="./assets/liveos-icon.png?v=liveos-v1">
<title>LiveOS – Mach dir dein Leben einfach.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    .modal-backdrop { backdrop-filter: blur(3px); }
    input, select, textarea, button { font: inherit; }
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    body { padding-bottom: 0; }

    nav button { -webkit-tap-highlight-color: transparent; }
    /* Short, lightweight motion for page changes and touch feedback. */
    /* Animate the complete page as well as its individual sections. */
    main#ua-page-content.ua-page-enter {
      animation: ua-page-container-in 460ms cubic-bezier(.18,.72,.25,1) both;
      will-change: opacity, transform;
    }
    .ua-page-enter > .space-y-6 > * {
      animation: ua-page-item-in 420ms cubic-bezier(.18,.72,.25,1) both;
      will-change: opacity, transform;
    }
    .ua-page-enter > .space-y-6 > *:nth-child(1) { animation-delay: 0ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(2) { animation-delay: 35ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(3) { animation-delay: 65ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(4) { animation-delay: 95ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(5) { animation-delay: 125ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(n+6) { animation-delay: 145ms; }
    .ua-hero-fuse {
      overflow: visible;
      opacity: .9;
    }
    .ua-hero-fuse-thread {
      fill: none;
      stroke: url(#ua-hero-fuse-gradient);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: none;
    }
    .ua-hero-aircraft {
      opacity: 0;
      filter: drop-shadow(0 0 3px rgba(147,197,253,.95)) drop-shadow(0 0 8px rgba(96,165,250,.75));
      pointer-events: none;
    }
    .ua-page-enter .ua-hero-aircraft {
      opacity: 1;
      animation: ua-hero-aircraft-arrive 3.05s ease-out both;
    }
    .ua-hero-aircraft path {
      fill: #f8fafc;
      stroke: #bfdbfe;
      stroke-width: 1.1;
      stroke-linejoin: round;
    }
    @keyframes ua-hero-aircraft-arrive {
      0%, 5% { opacity: 0; }
      14%, 82% { opacity: 1; }
      100% { opacity: .94; }
    }
    @keyframes ua-hero-fuse-burn {
      0%, 4% { stroke-dashoffset: 1; opacity: 0; }
      12% { opacity: .92; }
      76% { stroke-dashoffset: .12; opacity: .68; }
      91% { stroke-dashoffset: 0; opacity: .26; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes ua-page-container-in {
      from { opacity: .35; transform: translate3d(0, 16px, 0) scale(.995); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes ua-page-item-in {
      from { opacity: .25; transform: translate3d(0, 14px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes ua-modal-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ua-modal-panel-in {
      from { opacity: 0; transform: translate3d(0, 10px, 0) scale(.985); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    .ua-modal-enter { animation: ua-modal-backdrop-in 190ms ease-out both; }
    .ua-modal-enter > div { animation: ua-modal-panel-in 240ms cubic-bezier(.2,.75,.25,1) both; }
    .modal-backdrop { animation: ua-modal-backdrop-in 190ms ease-out both; }
    .modal-backdrop > div { animation: ua-modal-panel-in 240ms cubic-bezier(.2,.75,.25,1) both; }
    nav button {
      transition: color 200ms ease, background-color 220ms ease, box-shadow 220ms ease, transform 220ms cubic-bezier(.2,.75,.25,1);
    }
    nav button:active { transform: scale(.96); }
    nav button span:first-child {
      transition: transform 220ms cubic-bezier(.2,.75,.25,1), background-color 220ms ease, color 220ms ease;
    }
    nav button:active span:first-child { transform: scale(.92); }
    button[data-action] {
      transition-property: color, background-color, border-color, box-shadow, transform, opacity;
      transition-duration: 190ms;
      transition-timing-function: cubic-bezier(.2,.75,.25,1);
      -webkit-tap-highlight-color: transparent;
    }
    button[data-action]:active:not(:disabled) { transform: scale(.975); }
    main#ua-page-content section { transition: box-shadow 220ms ease, border-color 220ms ease; }
    @media (hover: hover) and (pointer: fine) {
      main#ua-page-content section:hover { box-shadow: 0 10px 28px rgba(15, 23, 42, 0.055); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ua-page-enter > .space-y-6 > *, .ua-modal-enter, .ua-modal-enter > div,
      .modal-backdrop, .modal-backdrop > div { animation: none !important; }
      .ua-hero-fuse-thread { animation: none !important; stroke-dashoffset: 0; opacity: .32; }
      nav button, nav button span:first-child, button[data-action],
      main#ua-page-content section { transition: none !important; }
      .ua-nav-indicator-moving, .ua-nav-icon-pop, .ua-nav-label-pop, .ua-nav-indicator-moving::after { animation: none !important; }
    }
    .person-dark-input {
      background: rgba(255, 255, 255, 0.07) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #fff !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px rgba(0, 0, 0, 0.10);
    }
    .person-dark-input::placeholder {
      color: rgba(255, 255, 255, 0.42) !important;
    }
    .person-dark-input:focus {
      border-color: rgba(255, 255, 255, 0.24) !important;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .person-dark-input:disabled {
      opacity: 0.6;
    }
    .debt-choice {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.78);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
    }
    .debt-choice:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
    }
    .debt-choice.active {
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.96);
      color: #0f172a;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .debt-person-picker {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
    }
    .debt-person-picker:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.14);
    }
    .glass-nav {
      background: rgba(247, 252, 255, 0.86);
      border-top: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 -8px 24px rgba(14, 116, 144, 0.08), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
    }
    .ua-nav-track { position: relative; isolation: isolate; }
    .ua-nav-indicator {
      position: absolute; z-index: 0; top: 0; bottom: 0; left: 0;
      border-radius: 1rem; background: #0f172a;
      box-shadow: 0 8px 20px rgba(15,23,42,.18), inset 0 1px 0 rgba(255,255,255,.08);
      pointer-events: none; overflow: hidden;
    }
    .ua-nav-indicator::after {
      content: ""; position: absolute; top: -80%; bottom: -80%; left: -50%; width: 42%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transform: skewX(-18deg); opacity: 0;
    }
    .ua-nav-indicator-moving { animation: ua-nav-sweep 560ms cubic-bezier(.16,.82,.22,1) both; will-change: transform; transform-origin: center; }
    .ua-nav-indicator-moving::after { opacity: 1; animation: ua-nav-sheen 560ms ease-out both; }
    .ua-nav-label { display: inline-block; transform-origin: center bottom; }
    .ua-nav-label-pop { animation: ua-nav-label-pop 420ms cubic-bezier(.18,.72,.25,1) both; }
    .ua-nav-item {
      position: relative; z-index: 1; display: flex; min-width: 0; flex: 1;
      flex-direction: column; align-items: center; justify-content: center; gap: .25rem;
      border-radius: 1rem; padding: .5rem .5rem; background: transparent;
      -webkit-tap-highlight-color: transparent;
      transition: color 200ms ease, transform 220ms cubic-bezier(.2,.75,.25,1);
    }
    .ua-nav-item:active { transform: scale(.96); }
    .ua-nav-icon { transition: transform 220ms cubic-bezier(.2,.75,.25,1), background-color 220ms ease; }
    .ua-nav-icon-pop { animation: ua-nav-icon-pop 420ms cubic-bezier(.18,.72,.25,1) both; }
    @keyframes ua-nav-sweep {
      0% { transform: var(--ua-nav-from) scale(.94,.92); filter: brightness(.92); }
      48% { transform: var(--ua-nav-to) scale(1.045,1.055); filter: brightness(1.10); }
      70% { transform: var(--ua-nav-to) scale(.99,.99); filter: brightness(1.02); }
      86% { transform: var(--ua-nav-to) scale(1.012,1.015); filter: brightness(1.01); }
      100% { transform: var(--ua-nav-to) scale(1,1); filter: brightness(1); }
    }
    @keyframes ua-nav-sheen { 0% { left: -50%; opacity: 0; } 24% { opacity: 1; } 100% { left: 125%; opacity: 0; } }
    @keyframes ua-nav-icon-pop {
      0% { transform: scale(.76) translateY(2px); }
      52% { transform: scale(1.14) translateY(-2px); }
      74% { transform: scale(.96) translateY(0); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes ua-nav-label-pop {
      0% { opacity: .68; transform: translateY(3px) scale(.92); }
      58% { opacity: 1; transform: translateY(-1px) scale(1.04); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }


    .ai-thinking-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(96, 165, 250, 0.24);
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(239,246,255,0.92), rgba(248,250,252,0.98));
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.08), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    .ai-thinking-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -45%;
      width: 42%;
      background: linear-gradient(110deg, transparent, rgba(255,255,255,0.78), transparent);
      transform: skewX(-18deg);
      animation: ai-card-sheen 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .ai-thinking-text {
      display: inline-block;
      background: linear-gradient(100deg, #64748b 5%, #2563eb 34%, #7dd3fc 48%, #2563eb 62%, #64748b 95%);
      background-size: 240% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: ai-text-shimmer 2.1s linear infinite;
    }
    .ai-thinking-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #60a5fa;
      animation: ai-dot-pulse 1s ease-in-out infinite;
    }
    .ai-thinking-dot:nth-child(2) { animation-delay: .16s; }
    .ai-thinking-dot:nth-child(3) { animation-delay: .32s; }
    @keyframes ai-card-sheen {
      0%, 12% { left: -45%; opacity: 0; }
      28% { opacity: .8; }
      66% { left: 115%; opacity: .45; }
      100% { left: 115%; opacity: 0; }
    }
    @keyframes ai-text-shimmer {
      from { background-position: 100% 0; }
      to { background-position: -140% 0; }
    }
    @keyframes ai-dot-pulse {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-3px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ai-thinking-card::before, .ai-thinking-text, .ai-thinking-dot { animation: none !important; }
    }

    .ai-source-list { display: grid; gap: 8px; margin-top: 12px; }
    .ai-source-card {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px 11px;
      border: 1px solid rgba(148,163,184,.20); border-radius: 15px;
      background: rgba(248,250,252,.92); text-decoration: none;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .ai-source-card:hover { border-color: rgba(96,165,250,.55); background: #eff6ff; transform: translateY(-1px); }
    .ai-source-favicon { width: 28px; height: 28px; border-radius: 9px; background: white; padding: 4px; object-fit: contain; flex: 0 0 auto; border: 1px solid #e2e8f0; }
    .ai-source-title { font-size: 11px; line-height: 1.35; font-weight: 700; color: #0f172a; }
    .ai-source-domain { margin-top: 3px; font-size: 10px; font-weight: 600; color: #2563eb; }
    .ai-source-snippet { margin-top: 4px; font-size: 10px; line-height: 1.45; color: #64748b; }
    .ai-source-heading { display: flex; align-items: center; gap: 6px; color: #64748b; font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .ai-recommendation-card {
      margin: .85rem 0; padding: 14px; border: 1px solid rgba(96,165,250,.24);
      border-radius: 18px; background: linear-gradient(145deg, #ffffff, #f8fbff);
      box-shadow: 0 5px 18px rgba(15,23,42,.035), inset 0 1px 0 #fff;
    }
    .ai-recommendation-card h3 { display: flex; align-items: center; gap: .55rem; margin-top: 0 !important; padding-bottom: 8px; border-bottom: 1px solid #eaf0f7; }
    .ai-recommendation-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9px; background: #eff6ff; color: #2563eb; }
    .ai-recommendation-card h3 strong { flex: 1; }
    .ai-recommendation-card > :last-child { margin-bottom: 0; }
    .ai-web-search-note { margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-size: 10px; line-height: 1.5; }
    .ai-web-search-note.is-limited { background: #fff7ed; color: #9a3412; }
    .ai-followups { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .ai-followup-chip { border: 1px solid #dbeafe; background: #f8fbff; color: #1d4ed8; border-radius: 999px; padding: 7px 10px; font-size: 10px; font-weight: 700; line-height: 1.35; text-align: left; transition: background .15s ease, border-color .15s ease; }
    .ai-followup-chip:hover { background: #eff6ff; border-color: #93c5fd; }
    .ai-markdown { color: #334155; overflow-wrap: anywhere; line-height: 1.72; }
    .ai-markdown p { margin: 0 0 .8rem; }
    .ai-markdown p:last-child { margin-bottom: 0; }
    .ai-markdown h3, .ai-markdown h4 { color: #0f172a; font-weight: 800; line-height: 1.35; letter-spacing: -.025em; margin: 1.1rem 0 .55rem; }
    .ai-markdown h3 { font-size: 1.02rem; }
    .ai-markdown h4 { font-size: .94rem; }
    .ai-markdown ul, .ai-markdown ol { display: grid; gap: .55rem; margin: .65rem 0 1rem; padding: 0; list-style: none; }
    .ai-markdown li { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: .42rem; align-items: start; }
    .ai-markdown .ai-markdown-bullet { display: block; width: 7px; height: 7px; border-radius: 999px; background: #3b82f6; margin: .62em auto 0; box-shadow: 0 0 0 3px #dbeafe; }
    .ai-markdown .ai-markdown-number { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 7px; background: #eff6ff; color: #1d4ed8; font-size: .68rem; font-weight: 800; margin-top: .1rem; }
    .ai-markdown strong { color: #0f172a; font-weight: 800; }
    .ai-markdown em { color: #475569; }
    .ai-markdown a { color: #2563eb; font-weight: 650; text-decoration: underline; text-decoration-color: #bfdbfe; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .ai-markdown code { padding: .12rem .32rem; border-radius: .4rem; background: #f1f5f9; color: #0f172a; font-size: .88em; }
    .ai-markdown blockquote { margin: .8rem 0; padding: .7rem .85rem; border-left: 3px solid #60a5fa; border-radius: 0 .8rem .8rem 0; background: #eff6ff; color: #334155; }
    .ai-markdown hr { margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0; }
    .ai-chat-disclaimer { padding: 10px 8px 2px; color: #94a3b8; text-align: center; font-size: 10px; line-height: 1.55; }
  
    .ua-status-screen {
      background:
        radial-gradient(ellipse at 50% 42%, rgba(219,234,254,0.50) 0%, rgba(248,250,252,0.88) 42%, #f8fafc 78%),
        #f8fafc;
      isolation: isolate;
    }
    .ua-status-glow {
      position: absolute;
      width: 18rem;
      height: 18rem;
      border-radius: 9999px;
      filter: blur(54px);
      pointer-events: none;
      opacity: 0.52;
    }
    .ua-status-glow-one { top: -8rem; left: -8rem; background: rgba(147,197,253,0.28); }
    .ua-status-glow-two { right: -9rem; bottom: -10rem; background: rgba(191,219,254,0.44); }
    .ua-loading-screen {
      color: #f8fafc;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(30,64,175,.34) 0%, rgba(15,23,42,0) 42%),
        radial-gradient(ellipse at 85% 88%, rgba(8,145,178,.12) 0%, rgba(8,145,178,0) 32%),
        linear-gradient(148deg, #070d1e 0%, #0f172a 48%, #111d3a 100%);
      isolation: isolate;
    }
    .ua-loading-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    .ua-loading-screen .ua-status-glow {
      width: 22rem; height: 22rem; filter: blur(72px); opacity: .8;
      animation: ua-splash-drift 8s ease-in-out infinite alternate;
    }
    .ua-loading-screen .ua-status-glow-one { top: -11rem; left: -10rem; background: rgba(37,99,235,.28); }
    .ua-loading-screen .ua-status-glow-two { right: -12rem; bottom: -12rem; background: rgba(6,182,212,.18); animation-delay: -3s; }
    .ua-splash-content {
      width: 100%; max-width: 26rem; padding: 2rem .5rem;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .ua-splash-logo-shell {
      position: relative; display: flex; width: 136px; height: 136px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(191,219,254,.27); border-radius: 38px;
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.045));
      box-shadow: 0 28px 70px rgba(0,0,0,.28), 0 0 0 8px rgba(147,197,253,.035), inset 0 1px 0 rgba(255,255,255,.18);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      animation: ua-splash-logo-arrive 700ms cubic-bezier(.2,.75,.25,1) both, ua-splash-logo-breathe 3.2s ease-in-out 700ms infinite;
    }
    .ua-splash-logo-shell::after {
      content: ""; position: absolute; inset: -8px; border: 1px solid rgba(125,211,252,.10);
      border-radius: 45px; pointer-events: none;
    }
    .ua-app-mark {
      display: block; width: 108px; height: 108px; border-radius: 28px;
      object-fit: cover; box-shadow: 0 12px 30px rgba(0,0,0,.24), 0 0 28px rgba(59,130,246,.16);
    }
    .ua-splash-brand { margin-top: 2rem; font-size: 11px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; color: #93c5fd; }
    .ua-splash-title { margin-top: .65rem; color: #fff; font-size: clamp(1.8rem, 7vw, 2.25rem); font-weight: 800; letter-spacing: -.045em; line-height: 1.12; }
    .ua-splash-subtitle { margin-top: .75rem; max-width: 19rem; color: rgba(226,232,240,.76); font-size: .96rem; line-height: 1.6; }
    .ua-splash-loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 18px; margin-top: 2rem; color: rgba(203,213,225,.78); font-size: .78rem; font-weight: 600; letter-spacing: .015em; }
    .ua-loading-dots { display: flex; align-items: center; justify-content: center; gap: 7px; }
    .ua-loading-dots span {
      display: block; width: 7px; height: 7px; border-radius: 9999px; background: #93c5fd;
      opacity: .38; transform: translateY(0) scale(.8); animation: ua-dot-bounce 850ms ease-in-out infinite;
    }
    .ua-loading-dots span:nth-child(2) { animation-delay: 150ms; }
    .ua-loading-dots span:nth-child(3) { animation-delay: 300ms; }
    .ua-splash-progress { position: relative; overflow: hidden; width: 158px; height: 3px; margin-top: 1rem; border-radius: 999px; background: rgba(148,163,184,.17); }
    .ua-splash-progress span {
      display: block; width: 38%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #60a5fa, #67e8f9); box-shadow: 0 0 14px rgba(96,165,250,.55);
      animation: ua-splash-progress 1.55s ease-in-out infinite;
    }
    .ua-splash-footer {

<body class="min-h-screen bg-gradient-to-b from-slate-50 via-white to-slate-50 text-slate-900">
<div id="root"></div>
<script>
(() => {
  "use strict";
  const STORAGE_KEY="liveos-allinone-v1";
  const TUTORIAL_KEY="liveos-intro-seen-v1";
  const root=document.getElementById("root");
  const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
  const defaultState=()=>({monthlyIncome:0,expenses:[],events:[],tasks:[],notes:[]});
  const loadState=()=>{try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(_){return defaultState();}};
  let data=loadState();
  let activePage=localStorage.getItem("liveos-active-page-v1")||"home";
  const pages=["home","finances","calendar","lists","more"];
  if(!pages.includes(activePage)) activePage="home";
  let tutorialOpen=localStorage.getItem(TUTORIAL_KEY)!=="true";
  let tutorialStep=0,bankModalOpen=false,navFrom=null,animatePage=true;
  const money=(value)=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(Number(value||0));
  const esc=(value)=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  const icon=(name,cls="h-5 w-5")=>'<i data-lucide="'+name+'" class="'+cls+'"></i>';
  const fmtDate=(date,opts)=>{if(!date)return "—";const d=new Date(date+"T12:00:00");return isNaN(d)?"—":new Intl.DateTimeFormat("de-DE",opts||{day:"2-digit",month:"short"}).format(d);};
  const monthKey=(date)=>String(date||"").slice(0,7);
  const currentMonth=()=>todayISO().slice(0,7);
  const monthExpenses=()=>data.expenses.filter(e=>monthKey(e.date)===currentMonth());
  const monthTotal=()=>monthExpenses().reduce((s,e)=>s+Number(e.amount||0),0);
  const remaining=()=>Number(data.monthlyIncome||0)-monthTotal();
  const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  const pageMeta=()=>{
    const titles={
      home:["Home","Dein persönlicher Überblick"],
      finances:["Finanzen","Einnahmen und Ausgaben im Blick"],
      calendar:["Kalender","Termine, Erinnerungen und Anrufe"],
      lists:["Listen","Aufgaben und Checklisten organisieren"],
      more:["Mehr","Notizen und weitere Werkzeuge"]
    };
    return titles[activePage]||titles.home;
  };
  function navIndex(page){return pages.indexOf(page);}
  function navItem(page,iconName,label){
    const active=activePage===page;
    const pop=active&&navFrom!==null&&navFrom!==page;
    return '<button type="button" data-action="navigate" data-page="'+page+'" aria-current="'+(active?"page":"false")+'" class="ua-nav-item '+(active?"text-white":"text-slate-500 hover:text-slate-900")+'">'+
      '<span class="ua-nav-icon flex h-9 w-9 items-center justify-center rounded-xl '+(active?"bg-white/10 text-white "+(pop?"ua-nav-icon-pop":""):"bg-transparent")+'">'+icon(iconName,"h-5 w-5")+'</span>'+
      '<span class="ua-nav-label text-[11px] font-semibold leading-none '+(pop?"ua-nav-label-pop":"")+'">'+label+'</span></button>';
  }
  function navIndicator(){
    const index=navIndex(activePage),from=navFrom===null?index:navIndex(navFrom);
    const translate=i=>i===0?"translateX(0)":"translateX(calc("+(i*100)+"% + "+(i*4)+"px))";
    return '<span aria-hidden="true" class="ua-nav-indicator '+(navFrom!==null&&from!==index?"ua-nav-indicator-moving":"")+'" style="width:calc((100% - 16px) / 5);--ua-nav-from:'+translate(from)+';--ua-nav-to:'+translate(index)+';transform:'+translate(index)+'"></span>';
  }
  function topbar(){
    const meta=pageMeta();
    return '<header class="mb-6 rounded-[2rem] bg-slate-900 p-4 text-white shadow-xl md:p-5">'+
      '<div class="flex items-center justify-between gap-4"><div class="flex min-w-0 items-center gap-3">'+
      '<img src="./assets/liveos-icon.svg?v=liveos-v1" alt="LiveOS" class="h-12 w-12 shrink-0 rounded-2xl bg-white object-contain p-1 shadow-lg ring-1 ring-white/20">'+
      '<div class="min-w-0"><div class="mb-1 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-xs font-medium text-white/80">'+icon("sparkles","h-3.5 w-3.5")+' LIVEOS</div><h1 class="truncate text-2xl font-bold tracking-tight md:text-3xl">'+meta[0]+'</h1><p class="mt-1 text-sm text-white/65">'+meta[1]+'</p></div></div>'+
      '<button type="button" data-action="bank-info" aria-label="Bankverbindung" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-white/15 bg-white/10 text-white/90 backdrop-blur-md transition hover:bg-white/15">'+icon("shield-check","h-5 w-5")+'</button></div>'+
      '<div class="mt-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white/10 p-3"><div><div class="text-xs text-white/60">Diesen Monat verfügbar</div><div class="mt-0.5 text-xl font-bold">'+money(remaining())+'</div></div><div class="text-right"><div class="text-xs text-white/60">Monatsausgaben</div><div class="mt-0.5 text-sm font-semibold">'+money(monthTotal())+'</div></div></div></header>';
  }
  function emptyState(title,text,iconName){
    return '<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/80 p-6 text-center"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-white text-slate-500 shadow-sm ring-1 ring-slate-200">'+icon(iconName||"inbox","h-6 w-6")+'</div><div class="mt-3 text-sm font-semibold text-slate-800">'+title+'</div><p class="mt-1 text-sm text-slate-500">'+text+'</p></div>';
  }
  function card(title,subtitle,iconName,content){
    return '<section class="liveos-card p-4 md:p-5"><div class="mb-4 flex items-start gap-3"><div class="liveos-icon-tile">'+icon(iconName||"circle","h-5 w-5")+'</div><div class="min-w-0 flex-1"><h2 class="text-base font-bold text-slate-900">'+title+'</h2>'+(subtitle?'<p class="mt-0.5 text-xs leading-5 text-slate-500">'+subtitle+'</p>':"")+'</div></div>'+content+'</section>';
  }
  function stat(title,value,iconName,helper){
    return '<div class="liveos-tile"><div class="flex items-center justify-between gap-2"><span class="text-xs font-semibold text-slate-500">'+title+'</span><span class="text-slate-400">'+icon(iconName,"h-4 w-4")+'</span></div><div class="mt-2 truncate text-xl font-extrabold tracking-tight text-slate-900">'+value+'</div><div class="mt-1 text-[11px] text-slate-400">'+helper+'</div></div>';
  }
  function homeHTML(){
    const openTasks=data.tasks.filter(t=>!t.done),upcoming=data.events.slice().filter(e=>(e.date||"")>=todayISO()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3);
    const progress=data.tasks.length?Math.round(data.tasks.filter(t=>t.done).length/data.tasks.length*100):0;
    const greeting=new Date().getHours()<11?"Guten Morgen":new Date().getHours()<18?"Hallo":"Guten Abend";
    const quick='<div class="grid grid-cols-2 gap-3 sm:grid-cols-4">'+
      '<button class="liveos-tile text-left" data-action="quick" data-page="finances"><span class="liveos-icon-tile">'+icon("plus","h-5 w-5")+'</span><span class="mt-3 block text-sm font-bold">Ausgabe</span><span class="mt-1 block text-xs text-slate-500">Schnell erfassen</span></button>'+
      '<button class="liveos-tile text-left" data-action="quick" data-page="calendar"><span class="liveos-icon-tile">'+icon("calendar-plus","h-5 w-5")+'</span><span class="mt-3 block text-sm font-bold">Termin</span><span class="mt-1 block text-xs text-slate-500">Einplanen</span></button>'+
      '<button class="liveos-tile text-left" data-action="quick" data-page="lists"><span class="liveos-icon-tile">'+icon("list-plus","h-5 w-5")+'</span><span class="mt-3 block text-sm font-bold">Aufgabe</span><span class="mt-1 block text-xs text-slate-500">Hinzufügen</span></button>'+
      '<button class="liveos-tile text-left" data-action="quick" data-page="more"><span class="liveos-icon-tile">'+icon("notebook-pen","h-5 w-5")+'</span><span class="mt-3 block text-sm font-bold">Notiz</span><span class="mt-1 block text-xs text-slate-500">Festhalten</span></button></div>';
    let ev=upcoming.length?'<div class="space-y-2">'+upcoming.map(e=>'<div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-3"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white text-slate-700 ring-1 ring-slate-200">'+icon(e.type==="Anruf"?"phone":"calendar-days","h-5 w-5")+'</div><div class="min-w-0 flex-1"><div class="truncate text-sm font-semibold text-slate-800">'+esc(e.title)+'</div><div class="mt-0.5 text-xs text-slate-500">'+fmtDate(e.date,{weekday:"short",day:"2-digit",month:"short"})+' · '+esc(e.time||"Uhrzeit offen")+'</div></div><span class="text-[11px] font-semibold text-slate-500">'+esc(e.type||"Termin")+'</span></div>').join("")+'</div>':emptyState("Noch nichts geplant","Plane deinen ersten Termin oder Anruf.","calendar");
    const todo=openTasks.length?'<div class="space-y-2">'+openTasks.slice(0,4).map(t=>'<button data-action="toggle-task" data-id="'+esc(t.id)+'" class="flex w-full items-center gap-3 rounded-2xl bg-slate-50 p-3 text-left"><span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md border border-slate-300 bg-white"></span><span class="min-w-0 flex-1 truncate text-sm font-medium text-slate-700">'+esc(t.title)+'</span>'+(t.due?'<span class="text-[11px] text-slate-400">'+fmtDate(t.due)+'</span>':"")+'</button>').join("")+'</div>':emptyState("Alles erledigt","Du hast gerade keine offenen Aufgaben.","check-check");
    return '<div class="space-y-6"><section class="relative overflow-hidden rounded-[2rem] bg-slate-900 p-5 text-white shadow-xl md:p-7"><div class="pointer-events-none absolute -right-10 -top-20 h-64 w-64 rounded-full border border-white/10 shadow-[0_0_0_35px_rgba(255,255,255,.02),0_0_0_70px_rgba(255,255,255,.015)]"></div><div class="relative z-10"><div class="text-xs font-bold uppercase tracking-[.18em] text-blue-200/80">'+greeting+' bei LiveOS</div><h2 class="mt-2 text-2xl font-extrabold tracking-tight md:text-3xl">Mach dir dein Leben einfach.</h2><p class="mt-2 max-w-xl text-sm leading-6 text-white/65">Deine Finanzen, Termine und Aufgaben – an einem Ort und auf einen Blick.</p><div class="mt-5 flex flex-wrap gap-2"><span class="rounded-full border border-white/10 bg-white/10 px-3 py-1.5 text-xs text-white/80">'+icon("calendar-days","mr-1 inline h-3.5 w-3.5")+' '+fmtDate(todayISO(),{weekday:"long",day:"2-digit",month:"long"})+'</span><span class="rounded-full border border-white/10 bg-white/10 px-3 py-1.5 text-xs text-white/80">'+data.tasks.filter(t=>!t.done).length+' offene Aufgaben</span></div></div></section>'+
      '<div class="grid grid-cols-2 gap-3 md:grid-cols-4">'+stat("Monatseinkommen",money(data.monthlyIncome),"wallet","Eingetragenes Monatsgehalt")+stat("Ausgaben",money(monthTotal()),"arrow-up-right","Im laufenden Monat")+stat("Übrig",money(remaining()),"piggy-bank","Nach deinen Ausgaben")+stat("Offene Aufgaben",String(openTasks.length),"list-checks","Noch zu erledigen")+'</div>'+
      card("Schnellzugriff","Das Wichtigste direkt eintragen","zap",quick)+
      '<div class="grid gap-4 md:grid-cols-2">'+card("Als Nächstes","Deine kommenden Termine und Anrufe","calendar-clock",ev)+card("Deine Aufgaben","Was heute noch ansteht","list-checks",todo)+'</div>'+
      '<p class="text-center text-[11px] leading-5 text-slate-400">Designversion 1 · Deine Einträge werden derzeit nur lokal in diesem Browser gespeichert.</p></div>';
  }
  function financesHTML(){
    const salaryForm='<form id="salary-form" class="space-y-3"><label class="block text-xs font-semibold text-slate-600">Monatsgehalt / monatliches Einkommen</label><div class="flex gap-2"><input class="liveos-field min-w-0" name="salary" type="number" min="0" step="0.01" value="'+esc(data.monthlyIncome||"")+'" placeholder="z. B. 2.500,00" required><button class="liveos-primary shrink-0" type="submit">'+icon("save","h-4 w-4")+' Speichern</button></div></form>';
    const expenseForm='<form id="expense-form" class="grid gap-3 sm:grid-cols-2"><input class="liveos-field sm:col-span-2" name="title" maxlength="80" placeholder="Wofür hast du Geld ausgegeben?" required><input class="liveos-field" name="amount" type="number" min="0.01" step="0.01" placeholder="Betrag in €" required><select class="liveos-field" name="category"><option>Essen</option><option>Wohnen</option><option>Mobilität</option><option>Freizeit</option><option>Kleidung</option><option>Technik</option><option>Abonnement</option><option>Sonstiges</option></select><input class="liveos-field" name="date" type="date" value="'+todayISO()+'" required><button class="liveos-primary sm:col-span-2" type="submit">'+icon("plus","h-4 w-4")+' Ausgabe eintragen</button></form>';
    const month=monthExpenses().slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const expenses=month.length?'<div class="space-y-2">'+month.map(e=>'<div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-3"><div class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-slate-600 ring-1 ring-slate-200">'+icon("receipt","h-5 w-5")+'</div><div class="min-w-0 flex-1"><div class="truncate text-sm font-semibold text-slate-800">'+esc(e.title)+'</div><div class="mt-0.5 text-xs text-slate-500">'+esc(e.category)+' · '+fmtDate(e.date)+'</div></div><div class="text-sm font-bold text-slate-900">'+money(e.amount)+'</div><button aria-label="Ausgabe löschen" data-action="delete-expense" data-id="'+esc(e.id)+'" class="ml-1 rounded-lg p-2 text-slate-400 hover:bg-white hover:text-rose-600">'+icon("trash-2","h-4 w-4")+'</button></div>').join("")+'</div>':emptyState("Noch keine Ausgaben","Trage deine erste Ausgabe ein, um deine Übersicht zu füllen.","receipt");
    const pct=data.monthlyIncome>0?Math.min(100,Math.round(monthTotal()/data.monthlyIncome*100)):0;
    return '<div class="space-y-6"><section class="rounded-[2rem] bg-slate-900 p-5 text-white shadow-xl md:p-6"><div class="flex items-center justify-between gap-3"><div><div class="text-xs font-semibold uppercase tracking-wider text-white/60">Finanzübersicht · '+fmtDate(todayISO(),{month:"long",year:"numeric"})+'</div><div class="mt-2 text-3xl font-extrabold">'+money(remaining())+'</div><div class="mt-1 text-sm text-white/65">Nach deinen erfassten Ausgaben übrig</div></div><div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white/10">'+icon("wallet-cards","h-7 w-7")+'</div></div><div class="mt-5 flex items-center justify-between text-xs text-white/70"><span>Ausgaben vom Monatsgehalt</span><span>'+pct+'%</span></div><div class="mt-2 h-2 overflow-hidden rounded-full bg-white/15"><div class="h-full rounded-full bg-blue-300" style="width:'+pct+'%"></div></div></section>'+
      '<div class="grid gap-4 md:grid-cols-2">'+card("Monatliches Einkommen","Trage dein Gehalt oder regelmäßiges Einkommen ein","banknote",salaryForm)+card("Deine Ausgaben","Jede Ausgabe übersichtlich erfassen","circle-dollar-sign",expenseForm)+'</div>'+
      card("Ausgaben in diesem Monat",month.length+" Einträge · Gesamt "+money(monthTotal()),"chart-no-axes-combined",expenses)+
      '<section class="rounded-3xl border border-blue-100 bg-blue-50/70 p-4"><div class="flex items-start gap-3"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white text-blue-700 shadow-sm">'+icon("shield-check","h-5 w-5")+'</div><div class="min-w-0 flex-1"><div class="text-sm font-bold text-slate-900">Bankkonto automatisch verbinden</div><p class="mt-1 text-xs leading-5 text-slate-600">Die Bankverbindung ist noch nicht freigeschaltet. Später soll ein regulierter Kontoinformationsdienst Umsätze nur mit deiner ausdrücklichen Zustimmung abrufen.</p><button class="mt-3 liveos-secondary" data-action="bank-info">Mehr zur Sicherheit</button></div></div></section></div>';
  }
  function calendarGrid(){
    const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=(new Date(year,month,1).getDay()+6)%7,total=new Date(year,month+1,0).getDate();
    const eventDays=new Set(data.events.filter(e=>monthKey(e.date)===currentMonth()).map(e=>Number(e.date.slice(8,10))));
    let cells="";
    for(let i=0;i<first;i++)cells+='<div class="liveos-day"></div>';
    for(let d=1;d<=total;d++){
      const isToday=d===now.getDate(),has=eventDays.has(d);
      cells+='<div class="liveos-day '+(isToday?"today ":"")+(has?"has-event":"")+'">'+d+'</div>';
    }
    return '<div class="grid grid-cols-7 gap-1 text-center">'+["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>'<div class="py-2 text-[10px] font-bold uppercase text-slate-400">'+x+'</div>').join("")+cells+'</div>';
  }
  function calendarHTML(){
    const eventForm='<form id="event-form" class="grid gap-3 sm:grid-cols-2"><input class="liveos-field sm:col-span-2" name="title" maxlength="90" placeholder="Name des Termins oder Anrufs" required><select class="liveos-field" name="type"><option>Termin</option><option>Anruf</option><option>Geburtstag</option><option>Erinnerung</option></select><input class="liveos-field" name="date" type="date" value="'+todayISO()+'" required><input class="liveos-field" name="time" type="time"><input class="liveos-field" name="note" maxlength="200" placeholder="Notiz (optional)"><button class="liveos-primary sm:col-span-2" type="submit">'+icon("calendar-plus","h-4 w-4")+' Einplanen</button></form>';
    const events=data.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const list=events.length?'<div class="space-y-2">'+events.map(e=>'<div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-3"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white text-slate-600 ring-1 ring-slate-200">'+icon(e.type==="Anruf"?"phone":e.type==="Geburtstag"?"cake":"calendar-days","h-5 w-5")+'</div><div class="min-w-0 flex-1"><div class="truncate text-sm font-semibold text-slate-800">'+esc(e.title)+'</div><div class="mt-0.5 text-xs text-slate-500">'+fmtDate(e.date,{weekday:"short",day:"2-digit",month:"short",year:"numeric"})+' · '+esc(e.time||"Keine Uhrzeit")+' · '+esc(e.type)+'</div>'+(e.note?'<div class="mt-1 truncate text-xs text-slate-400">'+esc(e.note)+'</div>':"")+'</div><button class="rounded-lg p-2 text-slate-400 hover:bg-white hover:text-rose-600" data-action="delete-event" data-id="'+esc(e.id)+'" aria-label="Termin löschen">'+icon("trash-2","h-4 w-4")+'</button></div>').join("")+'</div>':emptyState("Noch keine Termine","Erstelle einen Termin oder plane einen Anruf.","calendar-days");
    return '<div class="space-y-6"><div class="grid gap-4 md:grid-cols-[.9fr_1.1fr]">'+card("Monatskalender",fmtDate(todayISO(),{month:"long",year:"numeric"}),"calendar-days",calendarGrid())+card("Termin oder Anruf planen","Lege fest, wann du etwas erledigen möchtest","calendar-plus",eventForm)+'</div>'+card("Deine Termine",events.length+" Einträge","clock",list)+'</div>';
  }
  function listsHTML(){
    const taskForm='<form id="task-form" class="grid gap-3 sm:grid-cols-[1fr_auto]"><input class="liveos-field" name="title" maxlength="100" placeholder="Was möchtest du erledigen?" required><button class="liveos-primary" type="submit">'+icon("plus","h-4 w-4")+' Aufgabe hinzufügen</button><input class="liveos-field" name="due" type="date" aria-label="Fällig am"><select class="liveos-field" name="priority"><option value="Normal">Normale Priorität</option><option value="Hoch">Hohe Priorität</option><option value="Niedrig">Niedrige Priorität</option></select></form>';
    const tasks=data.tasks.slice().sort((a,b)=>Number(a.done)-Number(b.done));
    const taskList=tasks.length?'<div class="space-y-2">'+tasks.map(t=>'<div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-3"><input type="checkbox" class="liveos-check" data-action="toggle-task" data-id="'+esc(t.id)+'" '+(t.done?"checked":"")+' aria-label="Aufgabe erledigt"><div class="min-w-0 flex-1"><div class="truncate text-sm font-semibold '+(t.done?"text-slate-400 line-through":"text-slate-800")+'">'+esc(t.title)+'</div><div class="mt-0.5 text-xs text-slate-500">'+(t.due?"Fällig: "+fmtDate(t.due)+" · ":"")+esc(t.priority||"Normal")+'</div></div><button class="rounded-lg p-2 text-slate-400 hover:bg-white hover:text-rose-600" data-action="delete-task" data-id="'+esc(t.id)+'" aria-label="Aufgabe löschen">'+icon("trash-2","h-4 w-4")+'</button></div>').join("")+'</div>':emptyState("Deine Liste ist noch leer","Füge Aufgaben hinzu und hake sie ab, sobald du fertig bist.","list-checks");
    const done=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;
    return '<div class="space-y-6">'+card("Neue Aufgabe","Erstelle deine persönliche To-do-Liste","list-plus",taskForm)+'<section class="liveos-card p-4 md:p-5"><div class="flex items-center justify-between"><div><h2 class="text-base font-bold text-slate-900">Meine Aufgaben</h2><p class="mt-0.5 text-xs text-slate-500">'+done+' von '+tasks.length+' erledigt</p></div><div class="text-sm font-bold text-slate-700">'+pct+'%</div></div><div class="liveos-progress mt-3"><span style="width:'+pct+'%"></span></div><div class="mt-4">'+taskList+'</div></section></div>';
  }
  function moreHTML(){
    const noteForm='<form id="note-form" class="space-y-3"><input class="liveos-field" name="title" maxlength="90" placeholder="Überschrift deiner Notiz" required><textarea class="liveos-field min-h-24 resize-y" name="body" maxlength="2500" placeholder="Schreibe deine Notiz..." required></textarea><button class="liveos-primary" type="submit">'+icon("notebook-pen","h-4 w-4")+' Notiz speichern</button></form>';
    const notes=data.notes.slice().sort((a,b)=>b.createdAt-a.createdAt);
    const list=notes.length?'<div class="grid gap-3 sm:grid-cols-2">'+notes.map(n=>'<article class="rounded-2xl bg-slate-50 p-4"><div class="flex items-start justify-between gap-3"><h3 class="text-sm font-bold text-slate-800">'+esc(n.title)+'</h3><button class="rounded-lg p-1.5 text-slate-400 hover:bg-white hover:text-rose-600" data-action="delete-note" data-id="'+esc(n.id)+'" aria-label="Notiz löschen">'+icon("trash-2","h-4 w-4")+'</button></div><p class="mt-2 whitespace-pre-wrap text-sm leading-6 text-slate-600">'+esc(n.body)+'</p></article>').join("")+'</div>':emptyState("Noch keine Notizen","Halte Ideen, Gedanken und wichtige Informationen fest.","notebook-pen");
    return '<div class="space-y-6">'+card("Neue Notiz","Deine Gedanken sicher festhalten","notebook-pen",noteForm)+card("Gespeicherte Notizen",notes.length+" Notizen","files",list)+
      '<section class="liveos-card p-4 md:p-5"><div class="flex items-start gap-3"><div class="liveos-icon-tile">'+icon("settings","h-5 w-5")+'</div><div class="min-w-0 flex-1"><h2 class="text-base font-bold text-slate-900">Daten & Einstellungen</h2><p class="mt-1 text-xs leading-5 text-slate-500">In Version 1 liegen deine Einträge lokal in diesem Browser. Du kannst eine Sicherung exportieren oder die lokalen Daten löschen.</p><div class="mt-4 flex flex-wrap gap-2"><button class="liveos-secondary" data-action="export-data">'+icon("download","h-4 w-4")+' Daten exportieren</button><button class="liveos-secondary" data-action="bank-info">'+icon("shield-check","h-4 w-4")+' Banksicherheit</button><button class="liveos-secondary" data-action="reset-data">'+icon("trash-2","h-4 w-4")+' Alle Daten löschen</button></div></div></div></section></div>';
  }
  function bankModal(){
    return '<div class="fixed inset-0 z-[130] flex items-center justify-center bg-slate-950/55 px-3 py-5 backdrop-blur-sm" role="dialog" aria-modal="true"><section class="w-full max-w-lg rounded-[2rem] bg-white p-5 shadow-2xl sm:p-6"><div class="flex items-center gap-3"><div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-50 text-blue-700">'+icon("shield-check","h-6 w-6")+'</div><div><div class="text-xs font-bold uppercase tracking-wider text-slate-400">LiveOS Sicherheit</div><h2 class="text-xl font-extrabold text-slate-900">Bankkonto verbinden</h2></div></div><p class="mt-4 text-sm leading-6 text-slate-600">Die Bankverbindung ist in dieser ersten Version noch nicht aktiv. Später wird LiveOS dafür einen regulierten Kontoinformationsdienst nutzen. Du wirst dann ausdrücklich zustimmen und dich direkt bei deiner Bank authentifizieren.</p><div class="mt-4 rounded-2xl bg-slate-50 p-4 text-xs leading-5 text-slate-600"><div class="mb-2 font-bold text-slate-800">Unsere Grundregeln</div><div class="space-y-1.5"><div>• LiveOS fragt niemals dein Online-Banking-Passwort ab.</div><div>• Die Verbindung bleibt freiwillig und widerrufbar.</div><div>• Übertragungen werden verschlüsselt.</div><div>• Automatischer Umsatzimport wird erst nach technischer Prüfung aktiviert.</div></div></div><div class="mt-5 flex justify-end"><button class="liveos-primary" data-action="close-bank">Verstanden</button></div></section></div>';
  }
  function onboardingHTML(){
    const slides=[
      ["WILLKOMMEN BEI LIVEOS","Mach dir dein Leben einfach.","Dein Alltag hat viele Bereiche. LiveOS bringt sie an einem Ort zusammen – übersichtlich, persönlich und einfach zu bedienen.","sparkles",["Ein Überblick","Ein Kalender","Deine Listen"]],
      ["DEINE FINANZEN","Behalte dein Geld im Blick.","Trage dein Monatsgehalt ein, erfasse Ausgaben und behalte Abos, Budgets und deinen verfügbaren Betrag im Blick.","wallet-cards",["Einnahmen","Ausgaben","Monatsübersicht"]],
      ["DEINE ZEIT","Plane, was wichtig ist.","Organisiere Termine, Geburtstage, Erinnerungen und geplante Anrufe in deinem Kalender.","calendar-days",["Termine","Erinnerungen","Anrufe"]],
      ["DEINE ORGANISATION","Alles auf deiner Liste.","Erstelle To-dos, Einkaufslisten und Notizen. So bleiben Aufgaben, Ideen und wichtige Dinge leicht auffindbar.","list-checks",["To-dos","Checklisten","Notizen"]],
      ["SICHERHEIT & BANKKONTO","Du entscheidest, was du verbindest.","Eine Bankverbindung ist freiwillig. Sobald LiveOS einen regulierten Kontoinformationsdienst eingebunden hat, kannst du Umsätze nach deiner Zustimmung automatisch abrufen. Bis dahin trägst du Ausgaben manuell ein.","shield-check",["Optional","Deine Zustimmung","Datenschutz zuerst"]]
    ];
    const s=slides[tutorialStep],chips=s[4].map(x=>'<span class="rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600">'+x+'</span>').join("");
    const progress=slides.map((x,i)=>'<span class="h-1.5 flex-1 rounded-full '+(i<=tutorialStep?"bg-slate-900":"bg-slate-200")+'"></span>').join("");
    return '<div class="liveos-onboarding fixed inset-0 z-[160] flex items-center justify-center overflow-y-auto bg-slate-950/65 px-3 py-5 backdrop-blur-md sm:px-5" role="dialog" aria-modal="true" aria-label="LiveOS Einführung"><section class="liveos-onboarding-panel my-auto w-full max-w-3xl overflow-hidden rounded-[2rem] bg-white shadow-2xl ring-1 ring-white/20"><div class="flex items-center justify-between gap-3 px-5 pt-5 sm:px-7 sm:pt-6"><div class="flex items-center gap-2.5"><img src="./assets/liveos-icon.svg?v=liveos-v1" alt="" class="h-10 w-10 rounded-xl object-contain"><div><div class="text-sm font-extrabold text-slate-900">LiveOS</div><div class="text-[11px] text-slate-400">Dein Alltag. Ein Ort.</div></div></div><button data-action="tutorial-skip" class="rounded-full px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-slate-100">Überspringen</button></div><div class="grid gap-6 px-5 pb-5 pt-5 sm:grid-cols-[.92fr_1.08fr] sm:gap-8 sm:px-7 sm:pb-7 sm:pt-7"><div class="liveos-hero-art relative flex min-h-[210px] items-center justify-center overflow-hidden rounded-[1.7rem] p-7 text-white sm:min-h-[285px]"><div class="absolute -right-12 -top-16 h-48 w-48 rounded-full border border-white/10"></div><div class="absolute -right-2 -top-6 h-32 w-32 rounded-full border border-white/10"></div><div class="absolute -bottom-20 -left-16 h-48 w-48 rounded-full bg-blue-400/15 blur-2xl"></div><div class="relative z-10 flex flex-col items-center text-center"><div class="flex h-24 w-24 items-center justify-center rounded-[2rem] border border-white/15 bg-white/10 shadow-xl backdrop-blur-xl sm:h-28 sm:w-28">'+icon(s[3],"h-12 w-12 sm:h-14 sm:w-14")+'</div><div class="mt-5 text-xs font-bold uppercase tracking-[.2em] text-blue-100/80">LiveOS · '+(tutorialStep+1)+'/'+slides.length+'</div><div class="mt-2 text-sm font-medium text-white/75">Mach dir dein Leben einfach.</div></div></div><div class="flex flex-col justify-center"><div class="text-[10px] font-extrabold uppercase tracking-[.19em] text-blue-700">'+s[0]+'</div><h2 class="mt-3 text-2xl font-extrabold leading-tight tracking-tight text-slate-950 sm:text-3xl">'+s[1]+'</h2><p class="mt-3 text-sm leading-6 text-slate-600 sm:text-base sm:leading-7">'+s[2]+'</p><div class="mt-5 flex flex-wrap gap-2">'+chips+'</div><div class="mt-7 flex items-center gap-1.5">'+progress+'</div><div class="mt-6 flex items-center justify-between gap-3"><button data-action="tutorial-prev" class="rounded-2xl px-4 py-3 text-sm font-semibold text-slate-500 hover:bg-slate-100 '+(tutorialStep===0?"invisible":"")+'">Zurück</button><button data-action="tutorial-next" class="liveos-primary">'+(tutorialStep===slides.length-1?"LiveOS entdecken":"Weiter")+' '+icon("arrow-right","h-4 w-4")+'</button></div><p class="mt-3 text-center text-[11px] leading-5 text-slate-400">Du kannst das Tutorial jederzeit überspringen. Deine Einträge bleiben in dieser Version lokal auf deinem Gerät.</p></div></div></section></div>';
  }
  function appHTML(){
    const body=activePage==="home"?homeHTML():activePage==="finances"?financesHTML():activePage==="calendar"?calendarHTML():activePage==="lists"?listsHTML():moreHTML();
    const title=pageMeta()[0];
    return '<div class="min-h-screen bg-gradient-to-b from-slate-50 via-white to-slate-50 text-slate-900"><div class="mx-auto w-full max-w-6xl px-4 pb-32 pt-5 md:px-6 md:pb-32 md:pt-6">'+topbar()+'<main id="ua-page-content" class="'+(animatePage?"ua-page-enter":"")+'"><div class="space-y-6">'+body+'</div></main></div><nav class="glass-nav fixed bottom-0 left-0 right-0 z-40 px-3 pb-[max(0.65rem,env(safe-area-inset-bottom))] pt-2"><div class="ua-nav-track mx-auto grid max-w-xl grid-cols-5 gap-1">'+navIndicator()+navItem("home","house","Home")+navItem("finances","wallet","Finanzen")+navItem("calendar","calendar-days","Kalender")+navItem("lists","list-checks","Listen")+navItem("more","layout-grid","Mehr")+'</div></nav></div>';
  }
  function render(){
    root.innerHTML=appHTML()+(bankModalOpen?bankModal():"")+(tutorialOpen?tutorialHTML():"");
    if(window.lucide&&typeof window.lucide.createIcons==="function")window.lucide.createIcons();
    animatePage=false;navFrom=null;
  }
  function finishTutorial(){tutorialOpen=false;localStorage.setItem(TUTORIAL_KEY,"true");render();}
  document.addEventListener("click",function(event){
    const el=event.target.closest("[data-action]");if(!el)return;
    const action=el.dataset.action;
    if(action==="navigate"||action==="quick"){
      const page=el.dataset.page;if(pages.includes(page)){if(page!==activePage){navFrom=activePage;animatePage=true;}activePage=page;localStorage.setItem("liveos-active-page-v1",page);render();}
      return;
    }
    if(action==="tutorial-skip"){finishTutorial();return;}
    if(action==="tutorial-prev"){tutorialStep=Math.max(0,tutorialStep-1);render();return;}
    if(action==="tutorial-next"){if(tutorialStep<4){tutorialStep++;render();}else finishTutorial();return;}
    if(action==="bank-info"){bankModalOpen=true;render();return;}
    if(action==="close-bank"){bankModalOpen=false;render();return;}
    if(action==="delete-expense"){data.expenses=data.expenses.filter(x=>x.id!==el.dataset.id);save();render();return;}
    if(action==="delete-event"){data.events=data.events.filter(x=>x.id!==el.dataset.id);save();render();return;}
    if(action==="toggle-task"){
      const task=data.tasks.find(x=>x.id===el.dataset.id);if(task){task.done=!task.done;save();render();}return;
    }
    if(action==="delete-task"){data.tasks=data.tasks.filter(x=>x.id!==el.dataset.id);save();render();return;}
    if(action==="delete-note"){data.notes=data.notes.filter(x=>x.id!==el.dataset.id);save();render();return;}
    if(action==="export-data"){
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="liveos-daten-"+todayISO()+".json";a.click();URL.revokeObjectURL(url);return;
    }
    if(action==="reset-data"){
      if(confirm("Möchtest du wirklich alle lokal gespeicherten LiveOS-Daten löschen?")){data=defaultState();save();render();}return;
    }
  });
  document.addEventListener("submit",function(event){
    const form=event.target;if(!form||!form.id)return;event.preventDefault();const fd=new FormData(form);
    if(form.id==="salary-form"){
      const salary=Number(fd.get("salary"));if(Number.isFinite(salary)&&salary>=0){data.monthlyIncome=salary;save();render();}return;
    }
    if(form.id==="expense-form"){
      const amount=Number(fd.get("amount"));if(!Number.isFinite(amount)||amount<=0)return;
      data.expenses.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:String(fd.get("title")||"").trim(),amount,category:String(fd.get("category")||"Sonstiges"),date:String(fd.get("date")||todayISO())});
      save();render();return;
    }
    if(form.id==="event-form"){
      const title=String(fd.get("title")||"").trim();if(!title)return;
      data.events.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,type:String(fd.get("type")||"Termin"),date:String(fd.get("date")||todayISO()),time:String(fd.get("time")||""),note:String(fd.get("note")||"").trim()});
      save();render();return;
    }
    if(form.id==="task-form"){
      const title=String(fd.get("title")||"").trim();if(!title)return;
      data.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,due:String(fd.get("due")||""),priority:String(fd.get("priority")||"Normal"),done:false});
      save();render();return;
    }
    if(form.id==="note-form"){
      const title=String(fd.get("title")||"").trim(),body=String(fd.get("body")||"").trim();if(!title||!body)return;
      data.notes.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,body,createdAt:Date.now()});
      save();render();return;
    }
  });
  render();
})();

</script>
